<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{USER_NAME}}'s {{YEAR}} Sprint-Bot Wrapped</title>
    
    <!-- Meta tags for rich link previews on WhatsApp / Twitter -->
    <meta property="og:title" content="{{USER_NAME}}'s {{YEAR}} Writing Wrapped 🎁">
    <meta property="og:description" content="Total: {{TOTAL_WORDS}} words • {{NOVEL_TEXT}} • Persona: {{PERSONA_TITLE}}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#060b12">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Playfair+Display:ital,wght@0,600..900;1,600..900&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for 1-Tap All Stories Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #060b12;
            --card-bg: #0d1425;
            --accent: #22d3a0;
            --accent2: #6366f1;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 9:16 Story Frame Preview */
        .story-wrapper {
            position: relative;
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
            padding: 12px 12px 24px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #wrappedCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Story Progress Bars */
        .story-progress-bar {
            display: flex;
            gap: 5px;
            width: 100%;
            padding: 4px 6px 10px 6px;
        }

        .story-progress-segment {
            height: 3.5px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            transition: background 0.25s ease;
            cursor: pointer;
        }

        .story-progress-segment.active {
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .story-progress-segment.completed {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Tap indicator overlay */
        .tap-zone-left, .tap-zone-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 10;
        }
        .tap-zone-left { left: 0; }
        .tap-zone-right { right: 0; }

        /* Theme selector swatches */
        .theme-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .theme-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .theme-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.18);
        }

        .theme-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-0 m-0">

    <!-- Top Header -->
    <header class="w-full max-w-md flex justify-between items-center px-5 pt-4 pb-2">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎁</span>
            <span class="font-extrabold text-xs tracking-wider uppercase text-slate-300" style="font-family:'Syne'">Sprint-Bot Wrapped</span>
        </div>
        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            {{YEAR}}
        </span>
    </header>

    <!-- Main Story Card Area -->
    <main class="story-wrapper">
        
        <!-- Story Progress Bars (Instagram / Spotify Style) -->
        <div id="storyProgressBar" class="story-progress-bar">
            <!-- 6 Segments injected via JS -->
        </div>

        <!-- Canvas Container with Tap Zones -->
        <div class="canvas-container relative" id="canvasFrame">
            <canvas id="wrappedCanvas" width="1080" height="1920"></canvas>
            <div class="tap-zone-left" id="tapLeft" title="Previous Story"></div>
            <div class="tap-zone-right" id="tapRight" title="Next Story"></div>
        </div>

        <!-- Story Navigation Controls -->
        <div class="w-full flex items-center justify-between mt-3 px-2">
            <button id="prevBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-bold text-slate-300 border border-white/10 active:scale-95 transition">
                <span>◀</span> Prev
            </button>
            <div class="flex flex-col items-center">
                <span id="slideIndicator" class="text-xs font-extrabold text-white tracking-wide">Story 1 of 6</span>
                <span id="slideTitle" class="text-[10px] text-slate-400 font-medium">The Big Volume</span>
            </div>
            <button id="nextBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-bold text-slate-300 border border-white/10 active:scale-95 transition">
                Next <span>▶</span>
            </button>
        </div>

        <!-- Template Selector Section -->
        <div class="w-full mt-4">
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                    <span>🎨</span> Choose Aesthetic
                </span>
                <span id="theme-counter" class="text-[11px] font-bold text-slate-500">1 of 10</span>
            </div>

            <!-- Horizontal Themes Carousel -->
            <div id="theme-carousel" class="flex gap-2 overflow-x-auto no-scrollbar py-1 px-1">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full grid grid-cols-2 gap-2.5 mt-4">
            <button id="downloadThisBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-slate-900 bg-gradient-to-r from-emerald-400 to-teal-300 hover:from-emerald-300 hover:to-teal-200 active:scale-95 transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                <span>📲</span> Save This Slide
            </button>
            <button id="downloadAllBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 active:scale-95 transition shadow-lg shadow-indigo-500/20 cursor-pointer">
                <span id="zipIcon">📦</span> <span id="zipText">Save All (ZIP)</span>
            </button>
        </div>

        <button id="shareBtn" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-extrabold text-xs text-slate-200 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 active:scale-95 transition mt-2.5 cursor-pointer">
            <span>💬</span> Share to WhatsApp Status
        </button>

        <p class="text-[11px] text-slate-500 text-center mt-3">
            Tip: Tap left or right on the card to flip through your stories. Choose any theme!
        </p>
    </main>

    <!-- Data Injection -->
    <script>
        const WRAPPED_DATA = {{WRAPPED_DATA_JSON}};

        // 10 Curated Aesthetic Themes
        const THEMES = [
            {
                id: 'midnight',
                name: 'Midnight Neon',
                dot: 'linear-gradient(135deg, #22d3a0, #6366f1)',
                bg: '#060b12',
                card: '#0d1527',
                border: 'rgba(255, 255, 255, 0.08)',
                accent: '#22d3a0',
                accent2: '#6366f1',
                text: '#ffffff',
                sub: '#94a3b8',
                fontHeading: "'Syne', sans-serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'manuscript',
                name: 'Vintage Manuscript',
                dot: 'linear-gradient(135deg, #92400e, #d97706)',
                bg: '#fbf7ee',
                card: '#fffdf9',
                border: 'rgba(120, 53, 15, 0.12)',
                accent: '#92400e',
                accent2: '#b45309',
                text: '#1c1917',
                sub: '#78716c',
                fontHeading: "'Playfair Display', Georgia, serif",
                fontBody: "'Playfair Display', Georgia, serif"
            },
            {
                id: 'cosmic',
                name: 'Cosmic Starlight',
                dot: 'linear-gradient(135deg, #c084fc, #38bdf8)',
                bg: '#09081a',
                card: '#14122e',
                border: 'rgba(192, 132, 252, 0.18)',
                accent: '#c084fc',
                accent2: '#38bdf8',
                text: '#ffffff',
                sub: '#a5b4fc',
                fontHeading: "'Syne', sans-serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'blood_ink',

                bg: '#0b0205',
                card: '#1a060e',
                border: 'rgba(244, 63, 94, 0.18)',
                accent: '#f43f5e',
                accent2: '#fb7185',
                text: '#ffffff',
                sub: '#fda4af',
                fontHeading: "'Playfair Display', Georgia, serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'golden_hour',
                name: 'Golden Hour',
                dot: 'linear-gradient(135deg, #f59e0b, #fb923c)',
                bg: '#140a03',
                card: '#221206',
                border: 'rgba(245, 158, 11, 0.16)',
                accent: '#f59e0b',
                accent2: '#fb923c',
                text: '#ffffff',
                sub: '#fed7aa',
                fontHeading: "'Syne', sans-serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'minimal',
                name: 'Minimal Editorial',
                dot: 'linear-gradient(135deg, #ffffff, #71717a)',
                bg: '#000000',
                card: '#0f0f10',
                border: 'rgba(255, 255, 255, 0.12)',
                accent: '#ffffff',
                accent2: '#a1a1aa',
                text: '#ffffff',
                sub: '#71717a',
                fontHeading: "'Playfair Display', Georgia, serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'cyber',
                name: 'Cyber Scribe',
                dot: 'linear-gradient(135deg, #06b6d4, #ec4899)',
                bg: '#030712',
                card: '#081126',
                border: 'rgba(6, 182, 212, 0.18)',
                accent: '#06b6d4',
                accent2: '#ec4899',
                text: '#ffffff',
                sub: '#67e8f9',
                fontHeading: "'Space Grotesk', sans-serif",
                fontBody: "'Space Grotesk', sans-serif"
            },
            {
                id: 'emerald',
                name: 'Emerald Enclave',
                dot: 'linear-gradient(135deg, #34d399, #059669)',
                bg: '#021a13',
                card: '#052a20',
                border: 'rgba(52, 211, 153, 0.16)',
                accent: '#34d399',
                accent2: '#a7f3d0',
                text: '#ffffff',
                sub: '#6ee7b7',
                fontHeading: "'Syne', sans-serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'gold',
                name: 'Obsidian Gold',
                dot: 'linear-gradient(135deg, #fbbf24, #d97706)',
                bg: '#09090d',
                card: '#151520',
                border: 'rgba(251, 191, 36, 0.2)',
                accent: '#fbbf24',
                accent2: '#fef08a',
                text: '#ffffff',
                sub: '#fde68a',
                fontHeading: "'Playfair Display', Georgia, serif",
                fontBody: "'DM Sans', sans-serif"
            },
            {
                id: 'bubblegum',
                name: 'Y2K Bubblegum',
                dot: 'linear-gradient(135deg, #f472b6, #38bdf8)',
                bg: '#180b1e',
                card: '#291233',
                border: 'rgba(244, 114, 182, 0.2)',
                accent: '#f472b6',
                accent2: '#38bdf8',
                text: '#ffffff',
                sub: '#fbcfe8',
                fontHeading: "'Syne', sans-serif",
                fontBody: "'DM Sans', sans-serif"
            }
        ];

        // 6 Multi-Card Story Slides
        const SLIDES = [
            { id: 'volume', title: 'The Big Volume' },
            { id: 'consistency', title: 'Consistency & Momentum' },
            { id: 'sprints', title: 'Speed & Focus' },
            { id: 'superlatives', title: 'Writing Superlatives' },
            { id: 'persona', title: 'Writer Persona Reveal' },
            { id: 'summary', title: 'Full Master Summary' }
        ];

        let currentThemeIndex = 0;
        let currentSlideIndex = 0;

        // Render Story Progress Bar
        const progContainer = document.getElementById('storyProgressBar');
        SLIDES.forEach((s, idx) => {
            const seg = document.createElement('div');
            seg.className = `story-progress-segment ${idx === 0 ? 'active' : ''}`;
            seg.title = s.title;
            seg.onclick = () => goToSlide(idx);
            progContainer.appendChild(seg);
        });

        function updateProgressBar() {
            const segs = document.querySelectorAll('.story-progress-segment');
            segs.forEach((seg, idx) => {
                seg.classList.remove('active', 'completed');
                if (idx === currentSlideIndex) seg.classList.add('active');
                else if (idx < currentSlideIndex) seg.classList.add('completed');
            });
            document.getElementById('slideIndicator').textContent = `Story ${currentSlideIndex + 1} of ${SLIDES.length}`;
            document.getElementById('slideTitle').textContent = SLIDES[currentSlideIndex].title;
        }

        function goToSlide(idx) {
            currentSlideIndex = Math.max(0, Math.min(SLIDES.length - 1, idx));
            updateProgressBar();
            drawStoryCard(currentSlideIndex);
        }

        // Render Carousel Swatches
        const carousel = document.getElementById('theme-carousel');
        THEMES.forEach((t, i) => {
            const btn = document.createElement('button');
            btn.className = `theme-pill ${i === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span class="theme-dot" style="background:${t.dot}"></span><span>${t.name}</span>`;
            btn.onclick = () => selectTheme(i);
            carousel.appendChild(btn);
        });

        function selectTheme(index) {
            currentThemeIndex = index;
            document.querySelectorAll('.theme-pill').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.getElementById('theme-counter').textContent = `${index + 1} of ${THEMES.length}`;
            drawStoryCard(currentSlideIndex);
        }

        // Navigation bindings
        document.getElementById('prevBtn').onclick = () => goToSlide(currentSlideIndex - 1);
        document.getElementById('nextBtn').onclick = () => goToSlide(currentSlideIndex + 1);
        document.getElementById('tapLeft').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex - 1); };
        document.getElementById('tapRight').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex + 1); };

        // Touch Swipe Support
        let touchStartX = 0;
        const frame = document.getElementById('canvasFrame');
        frame.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        frame.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 45) goToSlide(currentSlideIndex + 1);
            else if (touchEndX - touchStartX > 45) goToSlide(currentSlideIndex - 1);
        }, { passive: true });

        // Safe Rounded Rectangle Helper (Clamps radius to prevent overshoot / wild lines)
        function rr(ctx, x, y, w, h, r, fill, stroke, strokeWidth) {
            r = Math.min(r, Math.floor(w / 2), Math.floor(h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke && strokeWidth > 0) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = strokeWidth;
                ctx.stroke();
            }
        }

        // Draw Ambient Backdrop (Gently faded, no harsh lines)
        function drawBackdrop(ctx, t, W, H) {
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, W, H);

            // Subtle top atmospheric glow
            const g1 = ctx.createRadialGradient(W / 2, 320, 0, W / 2, 320, 720);
            g1.addColorStop(0, t.accent + '1c');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            // Subtle bottom atmospheric glow
            const g2 = ctx.createRadialGradient(W - 120, H - 380, 0, W - 120, H - 380, 650);
            g2.addColorStop(0, t.accent2 + '14');
            g2.addColorStop(1, 'transparent');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);

            // Subtle faint sparkle dust
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            const dots = [
                [180, 180, 3], [890, 240, 4], [920, 850, 2.5], [140, 1100, 3],
                [820, 1420, 3.5], [220, 1650, 4], [520, 950, 2]
            ];
            dots.forEach(([x, y, rad]) => {
                ctx.beginPath();
                ctx.arc(x, y, rad, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Draw Standard Header
        function drawHeader(ctx, t, d, slideNum, totalSlides, W, BX, BW) {
            const curY = 100;
            ctx.fillStyle = t.accent;
            ctx.font = `bold 26px ${t.fontBody}`;
            ctx.textAlign = 'left';
            ctx.fillText("🎁 SPRINT-BOT WRAPPED", BX, curY);

            ctx.textAlign = 'right';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 24px ${t.fontBody}`;
            ctx.fillText(`${d.year.toUpperCase()} • ${slideNum}/${totalSlides}`, BX + BW, curY);
        }

        // Draw Standard Watermark Footer
        function drawFooter(ctx, t, W, H) {
            ctx.textAlign = 'center';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText("Created with Sprint-Bot • Track your writing journey", W / 2, H - 80);
        }

        // ==========================================
        // 1080x1920 CANVAS STORY RENDERER
        // ==========================================
        async function drawStoryCard(slideIdx = 0, targetCanvas = null) {
            await document.fonts.ready;
            const canvas = targetCanvas || document.getElementById('wrappedCanvas');
            const ctx = canvas.getContext('2d');
            const t = THEMES[currentThemeIndex];
            const d = WRAPPED_DATA;

            const W = 1080, H = 1920;
            canvas.width = W; canvas.height = H;
            const BX = 75, BW = W - 150;

            drawBackdrop(ctx, t, W, H);
            drawHeader(ctx, t, d, slideIdx + 1, SLIDES.length, W, BX, BW);
            drawFooter(ctx, t, W, H);

            // Render specific slide content
            switch(slideIdx) {
                case 0: renderSlideVolume(ctx, t, d, W, H, BX, BW); break;
                case 1: renderSlideConsistency(ctx, t, d, W, H, BX, BW); break;
                case 2: renderSlideSprints(ctx, t, d, W, H, BX, BW); break;
                case 3: renderSlideSuperlatives(ctx, t, d, W, H, BX, BW); break;
                case 4: renderSlidePersona(ctx, t, d, W, H, BX, BW); break;
                case 5: renderSlideSummary(ctx, t, d, W, H, BX, BW); break;
            }
        }

        // ── SLIDE 0: THE BIG VOLUME ──────────────────────────────────────
        function renderSlideVolume(ctx, t, d, W, H, BX, BW) {
            let curY = 170;

            // Author Badge Mini-Pill
            const pillW = Math.min(BW, ctx.measureText(d.userName).width + 240);
            rr(ctx, BX, curY, pillW, 70, 35, t.card, t.border, 1.5);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 24px ${t.fontBody}`;
            ctx.textAlign = 'left';
            ctx.fillText(`✍️ ${d.userName} • 👑 ${d.rank}`, BX + 30, curY + 44);

            curY += 130;
            ctx.fillStyle = t.sub;
            ctx.font = `bold 32px ${t.fontBody}`;
            ctx.fillText("THIS YEAR, YOU POURED DOWN...", BX, curY);

            // Giant Words Hero Box
            curY += 50;
            const boxH = 480;
            rr(ctx, BX, curY, BW, boxH, 40, t.card, t.border, 2);

            // Words Number
            const wordsFormatted = Number(d.totalWords || 0).toLocaleString();
            ctx.textAlign = 'center';
            ctx.fillStyle = t.text;
            let wSz = 135;
            ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            while (ctx.measureText(wordsFormatted).width > (BW - 80) && wSz > 60) {
                wSz -= 4;
                ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            }
            ctx.fillText(wordsFormatted, BX + BW / 2, curY + 220);

            ctx.fillStyle = t.accent;
            ctx.font = `800 36px ${t.fontHeading}`;
            ctx.fillText("TOTAL WORDS WRITTEN", BX + BW / 2, curY + 295);

            // Novel Equivalent Pill
            const novY = curY + 355;
            const novW = Math.min(BW - 80, 560), novH = 75;
            rr(ctx, (W - novW) / 2, novY, novW, novH, novH / 2, t.accent + '22', t.accent, 2);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 30px ${t.fontBody}`;
            ctx.fillText(`That's ${d.novelText}`, W / 2, novY + 48);

            // Breakdown Tiles
            curY += boxH + 45;
            const novCount = (d.totalWords / 80000).toFixed(1);
            const novellas = Math.round(d.totalWords / 20000);
            const chapters = Math.round(d.totalWords / 3000);

            const rowH = 160;
            const colW = (BW - 30) / 2;

            // Box 1: Novellas

                    const content = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = `${WRAPPED_DATA.userName}-SprintBot-Wrapped-${WRAPPED_DATA.year}-CompleteStory.zip`;
                    link.href = URL.createObjectURL(content);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
                } else {
                    // Fallback if JSZip is offline: sequential individual downloads
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = 1080;
                    offCanvas.height = 1920;
                    for (let i = 0; i < SLIDES.length; i++) {
                        await drawStoryCard(i, offCanvas);
                        const link = document.createElement('a');
                        link.download = `${WRAPPED_DATA.userName}-Wrapped-${WRAPPED_DATA.year}-Card${i + 1}-${SLIDES[i].id}.png`;
                        link.href = offCanvas.toDataURL('image/png', 1.0);
                        link.click();
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            } catch (err) {
                console.error("Error creating story bundle:", err);
                alert("Could not generate zip. Downloading current card instead.");
                document.getElementById('downloadThisBtn').click();
            } finally {
                zipIcon.textContent = "📦";
                zipText.textContent = originalText;
                // Restore current slide view
                drawStoryCard(currentSlideIndex);
            }
        };

        // WhatsApp Share Action
        document.getElementById('shareBtn').onclick = async () => {
            const canvas = document.getElementById('wrappedCanvas');
            const shareText = `Check out my ${WRAPPED_DATA.year} Writing Wrapped on Sprint-Bot! 🎁\n\nTotal Words: ${WRAPPED_DATA.totalWords.toLocaleString()} (${WRAPPED_DATA.novelText})\nPersona: ${WRAPPED_DATA.persona?.title || 'Writer'}\nLongest Streak: ${WRAPPED_DATA.bestStreak} days 🔥\n\nView and download your full story here: ${window.location.href}`;
            
            if (navigator.share) {
                try {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `wrapped-${WRAPPED_DATA.year}-${SLIDES[currentSlideIndex].id}.png`, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                files: [file]
                            });
                        } else {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                url: window.location.href
                            });
                        }
                    }, 'image/png');
                } catch (e) {
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                }
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
            }
        };
    </script>
</body>
</html>
