<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{USER_NAME}}'s {{YEAR}} Sprint-Bot Wrapped</title>
    
    <!-- Meta tags for rich link previews on WhatsApp / Twitter -->
    <meta property="og:title" content="{{USER_NAME}}'s {{YEAR}} Writing Wrapped 🎁">
    <meta property="og:description" content="Total: {{TOTAL_WORDS}} words • {{NOVEL_TEXT}} • Persona: {{PERSONA_TITLE}}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#060b12">

    <!-- Fonts inspired by AuthorRealm: Cinzel, Noto Serif, Playfair, Syncopate, Space Grotesk, Montserrat, Outfit, Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;900&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Outfit:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700&family=Space+Grotesk:wght@500;700&family=Syncopate:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for 1-Tap All Stories Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #05050a;
            --card-bg: #0d1425;
            --accent: #D4AF37;
            --accent2: #6366f1;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 9:16 Story Frame Preview */
        .story-wrapper {
            position: relative;
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
            padding: 12px 12px 24px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #wrappedCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Story Progress Bars */
        .story-progress-bar {
            display: flex;
            gap: 5px;
            width: 100%;
            padding: 4px 6px 10px 6px;
        }

        .story-progress-segment {
            height: 3.5px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            transition: background 0.25s ease;
            cursor: pointer;
        }

        .story-progress-segment.active {
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .story-progress-segment.completed {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Tap indicator overlay */
        .tap-zone-left, .tap-zone-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 10;
        }
        .tap-zone-left { left: 0; }
        .tap-zone-right { right: 0; }

        /* Theme selector swatches */
        .theme-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11.5px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .theme-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .theme-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.18);
        }

        .theme-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-0 m-0">

    <!-- Top Header -->
    <header class="w-full max-w-md flex justify-between items-center px-5 pt-4 pb-2">

    <!-- Main Story Card Area -->

        <!-- Action Buttons -->
        <div class="w-full grid grid-cols-2 gap-2.5 mt-4">
            <button id="downloadThisBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-slate-900 bg-gradient-to-r from-amber-400 to-amber-300 hover:from-amber-300 hover:to-amber-200 active:scale-95 transition shadow-lg shadow-amber-500/20 cursor-pointer">
                <span>📲</span> Save This Slide

            <button id="downloadAllBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 active:scale-95 transition shadow-lg shadow-indigo-500/20 cursor-pointer">

            },
            {
                id: 'midnight',
                name: 'Midnight Synthwave',
                dot: 'linear-gradient(135deg, #22d3ee, #6366f1)',
                bg: '#060717',
                card: '#0e122b',
                border: 'rgba(99, 102, 241, 0.35)',
                accent: '#22d3ee',

                texture: 'synthwave'
            }
        ];

        // 6 Multi-Card Story Slides
        const SLIDES = [
            { id: 'volume', title: 'The Big Volume' },
            { id: 'consistency', title: 'Consistency & Momentum' },
            { id: 'sprints', title: 'Speed & Focus' },
            { id: 'superlatives', title: 'Writing Superlatives' },
            { id: 'persona', title: 'Writer Persona Reveal' },
            { id: 'summary', title: 'Full Master Summary' }
        ];

        let currentThemeIndex = 0;
        let currentSlideIndex = 0;

        // Render Story Progress Bar
        const progContainer = document.getElementById('storyProgressBar');
        SLIDES.forEach((s, idx) => {
            const seg = document.createElement('div');
            seg.className = `story-progress-segment ${idx === 0 ? 'active' : ''}`;
            seg.title = s.title;
            seg.onclick = () => goToSlide(idx);
            progContainer.appendChild(seg);
        });

        function updateProgressBar() {
            const segs = document.querySelectorAll('.story-progress-segment');
            segs.forEach((seg, idx) => {
                seg.classList.remove('active', 'completed');
                if (idx === currentSlideIndex) seg.classList.add('active');
                else if (idx < currentSlideIndex) seg.classList.add('completed');
            });
            document.getElementById('slideIndicator').textContent = `Story ${currentSlideIndex + 1} of ${SLIDES.length}`;
            document.getElementById('slideTitle').textContent = SLIDES[currentSlideIndex].title;
        }

        function goToSlide(idx) {
            currentSlideIndex = Math.max(0, Math.min(SLIDES.length - 1, idx));
            updateProgressBar();
            drawStoryCard(currentSlideIndex);
        }

        // Render Carousel Swatches
        const carousel = document.getElementById('theme-carousel');
        THEMES.forEach((t, i) => {
            const btn = document.createElement('button');
            btn.className = `theme-pill ${i === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span class="theme-dot" style="background:${t.dot}"></span><span>${t.name}</span>`;
            btn.onclick = () => selectTheme(i);
            carousel.appendChild(btn);
        });

        function selectTheme(index) {
            currentThemeIndex = index;
            document.querySelectorAll('.theme-pill').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.getElementById('theme-counter').textContent = `${index + 1} of ${THEMES.length}`;
            drawStoryCard(currentSlideIndex);
        }

        // Navigation bindings
        document.getElementById('prevBtn').onclick = () => goToSlide(currentSlideIndex - 1);
        document.getElementById('nextBtn').onclick = () => goToSlide(currentSlideIndex + 1);
        document.getElementById('tapLeft').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex - 1); };
        document.getElementById('tapRight').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex + 1); };

        // Touch Swipe Support
        let touchStartX = 0;
        const frame = document.getElementById('canvasFrame');
        frame.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        frame.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 45) goToSlide(currentSlideIndex + 1);
            else if (touchEndX - touchStartX > 45) goToSlide(currentSlideIndex - 1);
        }, { passive: true });

        // Safe Rounded Rectangle Helper (Clamps radius to prevent overshoot / wild lines)
        function rr(ctx, x, y, w, h, r, fill, stroke, strokeWidth) {
            r = Math.min(r, Math.floor(w / 2), Math.floor(h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x + r, y);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke && strokeWidth > 0) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = strokeWidth;
                ctx.stroke();
            }
        }

        // ==========================================
        // TEXTURE ENGINES (AuthorRealm-Inspired)
        // ==========================================
        function drawThemeTexture(ctx, t, W, H) {
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, W, H);

            // 1. CELESTIAL STARLIGHT (Stars, constellations, orbital astrolabe)
            if (t.texture === 'celestial') {
                // Nebula glow
                const neb = ctx.createRadialGradient(W / 2, 380, 0, W / 2, 380, 750);
                neb.addColorStop(0, 'rgba(212, 175, 55, 0.12)');
                neb.addColorStop(0.5, 'rgba(99, 102, 241, 0.08)');
                neb.addColorStop(1, 'transparent');
                ctx.fillStyle = neb;
                ctx.fillRect(0, 0, W, H);

                // Celestial Astrolabe Rings
                ctx.save();
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.14)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.arc(W - 80, 260, 340, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(W - 80, 260, 220, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // Starfield
                const stars = [
                    [140, 160, 2, 0.8], [320, 240, 3, 0.9], [860, 190, 2.5, 0.7],
                    [920, 520, 3.5, 0.95], [210, 780, 2, 0.6], [820, 940, 3, 0.85],
                    [150, 1250, 2.5, 0.7], [740, 1450, 3, 0.9], [280, 1680, 2, 0.75],
                    [890, 1720, 2.5, 0.8], [540, 1100, 1.8, 0.5]
                ];
                stars.forEach(([x, y, rad, op]) => {
                    ctx.fillStyle = `rgba(255, 235, 160, ${op})`;
                    ctx.beginPath();
                    ctx.arc(x, y, rad, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Constellation Lines connecting key stars
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.18)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(140, 160); ctx.lineTo(320, 240); ctx.lineTo(540, 300); ctx.lineTo(860, 190);
                ctx.stroke();
            }

            // 2. ANCIENT PARCHMENT / GRIMOIRE (Parchment noise, tea stains, double rule)
            else if (t.texture === 'parchment') {
                // Corner paper stains
                const s1 = ctx.createRadialGradient(80, 80, 0, 80, 80, 420);
                s1.addColorStop(0, 'rgba(139, 69, 19, 0.08)');
                s1.addColorStop(1, 'transparent');
                ctx.fillStyle = s1;
                ctx.fillRect(0, 0, W, H);

                const s2 = ctx.createRadialGradient(W - 80, H - 120, 0, W - 80, H - 120, 480);
                s2.addColorStop(0, 'rgba(139, 69, 19, 0.09)');
                s2.addColorStop(1, 'transparent');
                ctx.fillStyle = s2;
                ctx.fillRect(0, 0, W, H);

                // Procedural paper grain specks
                ctx.fillStyle = 'rgba(100, 60, 20, 0.035)';
                for (let i = 0; i < 350; i++) {
                    const rx = (Math.sin(i * 99) * 0.5 + 0.5) * W;
                    const ry = (Math.cos(i * 33) * 0.5 + 0.5) * H;
                    ctx.fillRect(rx, ry, (i % 3) + 1, (i % 2) + 1);
                }

                // Antique framing rules
                ctx.strokeStyle = 'rgba(120, 53, 15, 0.2)';
                ctx.lineWidth = 2;
                ctx.strokeRect(35, 35, W - 70, H - 70);
                ctx.strokeStyle = 'rgba(120, 53, 15, 0.1)';
                ctx.lineWidth = 1;
                ctx.strokeRect(42, 42, W - 84, H - 84);

                // Corner cross markers
                ctx.strokeStyle = 'rgba(120, 53, 15, 0.35)';
                ctx.lineWidth = 2;
                const corners = [[35, 35], [W - 35, 35], [35, H - 35], [W - 35, H - 35]];
                corners.forEach(([cx, cy]) => {
                    ctx.beginPath();
                    ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy);
                    ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10);
                    ctx.stroke();
                });
            }

            // 3. MYSTIC GOTHIC BLOOD & VELVET
            else if (t.texture === 'gothic') {
                // Crimson velvet radial aura
                const rad = ctx.createRadialGradient(W / 2, 700, 50, W / 2, 700, 850);
                rad.addColorStop(0, 'rgba(138, 3, 3, 0.28)');
                rad.addColorStop(0.6, 'rgba(43, 0, 0, 0.45)');
                rad.addColorStop(1, '#090103');
                ctx.fillStyle = rad;
                ctx.fillRect(0, 0, W, H);

                // Velvet grain flecks
                ctx.fillStyle = 'rgba(244, 63, 94, 0.025)';
                for (let i = 0; i < 280; i++) {
                    const rx = (Math.sin(i * 47) * 0.5 + 0.5) * W;
                    const ry = (Math.cos(i * 73) * 0.5 + 0.5) * H;
                    ctx.fillRect(rx, ry, 2, 2);
                }

                // Gothic double border
                ctx.strokeStyle = 'rgba(138, 3, 3, 0.4)';
                ctx.lineWidth = 2;
                ctx.strokeRect(36, 36, W - 72, H - 72);
                ctx.strokeStyle = 'rgba(244, 63, 94, 0.2)';
                ctx.lineWidth = 1;
                ctx.strokeRect(44, 44, W - 88, H - 88);
            }

            // 4. CYBER SCRIBE HUD (Matrix terminal, perspective grid, scanlines)
            else if (t.texture === 'cyber') {
                // Perspective grid floor at bottom
                ctx.strokeStyle = 'rgba(0, 243, 255, 0.06)';
                ctx.lineWidth = 1;
                const gridTop = H - 550;
                for (let x = 0; x <= W; x += 80) {
                    ctx.beginPath();
                    ctx.moveTo(x, gridTop);
                    ctx.lineTo(W / 2 + (x - W / 2) * 2.8, H);
                    ctx.stroke();
                }
                for (let y = gridTop; y <= H; y += 45) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }

                // Horizontal Scanlines
                ctx.fillStyle = 'rgba(0, 243, 255, 0.015)';
                for (let y = 0; y < H; y += 5) {
                    ctx.fillRect(0, y, W, 1.5);
                }

                // Ambient cyan glow
                const g = ctx.createRadialGradient(W / 2, 350, 0, W / 2, 350, 650);
                g.addColorStop(0, 'rgba(0, 243, 255, 0.1)');
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
            }

            // 5. THE VILLA SUNSET (Love Island Miami Sunset Gradient & Frosted Orbs)
            else if (t.texture === 'sunset_villa') {
                const sunGrad = ctx.createLinearGradient(0, 0, W, H);
                sunGrad.addColorStop(0, '#ff007f');
                sunGrad.addColorStop(0.45, '#ff5e00');
                sunGrad.addColorStop(0.85, '#8a2be2');
                sunGrad.addColorStop(1, '#1b0024');
                ctx.fillStyle = sunGrad;
                ctx.fillRect(0, 0, W, H);

                // Frosted light bokeh orbs
                const orbs = [
                    [180, 280, 220, 'rgba(255, 255, 255, 0.08)'],
                    [W - 120, 650, 260, 'rgba(255, 240, 0, 0.1)'],
                    [W / 2, 1200, 320, 'rgba(0, 243, 255, 0.08)'],
                    [150, 1600, 250, 'rgba(255, 0, 127, 0.12)']
                ];
                orbs.forEach(([ox, oy, orad, ocolor]) => {
                    const og = ctx.createRadialGradient(ox, oy, 0, ox, oy, orad);
                    og.addColorStop(0, ocolor);
                    og.addColorStop(1, 'transparent');
                    ctx.fillStyle = og;
                    ctx.fillRect(0, 0, W, H);
                });
            }

            // 6. SOLARIS MODERN GLASS
            else if (t.texture === 'solaris') {
                const sg = ctx.createRadialGradient(160, 260, 0, 160, 260, 650);
                sg.addColorStop(0, 'rgba(56, 189, 248, 0.16)');
                sg.addColorStop(1, 'transparent');
                ctx.fillStyle = sg;
                ctx.fillRect(0, 0, W, H);

                const sg2 = ctx.createRadialGradient(W - 140, 950, 0, W - 140, 950, 600);
                sg2.addColorStop(0, 'rgba(52, 211, 153, 0.12)');
                sg2.addColorStop(1, 'transparent');
                ctx.fillStyle = sg2;
                ctx.fillRect(0, 0, W, H);
            }

            // 7. MINIMAL BROADSHEET (Newspaper Halftone & Sharp Double Rules)
            else if (t.texture === 'editorial') {
                // Halftone grid dots
                ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
                for (let x = 40; x < W; x += 32) {
                    for (let y = 40; y < H; y += 32) {
                        ctx.fillRect(x, y, 1.5, 1.5);
                    }
                }
                // Editorial border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 3;
                ctx.strokeRect(36, 36, W - 72, H - 72);
                ctx.lineWidth = 1;
                ctx.strokeRect(44, 44, W - 88, H - 88);
            }

            // 8. ENCHANTED GROVE (Botanical forest spores)
            else if (t.texture === 'botanical') {
                const fg = ctx.createRadialGradient(W / 2, 450, 0, W / 2, 450, 720);
                fg.addColorStop(0, 'rgba(16, 185, 129, 0.15)');
                fg.addColorStop(1, 'transparent');
                ctx.fillStyle = fg;
                ctx.fillRect(0, 0, W, H);

                // Bioluminescent firefly spores
                const spores = [
                    [150, 320, 4], [880, 410, 5], [260, 750, 3.5], [810, 890, 4.5],
                    [180, 1280, 4], [720, 1520, 5], [420, 1720, 3]
                ];
                spores.forEach(([sx, sy, srad]) => {
                    const spg = ctx.createRadialGradient(sx, sy, 0, sx, sy, srad * 4);
                    spg.addColorStop(0, 'rgba(167, 243, 208, 0.8)');
                    spg.addColorStop(0.4, 'rgba(16, 185, 129, 0.3)');
                    spg.addColorStop(1, 'transparent');
                    ctx.fillStyle = spg;
                    ctx.fillRect(sx - srad * 4, sy - srad * 4, srad * 8, srad * 8);
                });
            }

            // 9. IMPERIAL OBSIDIAN GOLD
            else if (t.texture === 'gold_marble') {
                // Gold marble veining / flecks
                const mg = ctx.createRadialGradient(W / 2, 380, 0, W / 2, 380, 750);
                mg.addColorStop(0, 'rgba(251, 191, 36, 0.16)');
                mg.addColorStop(1, 'transparent');
                ctx.fillStyle = mg;
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = 'rgba(251, 191, 36, 0.08)';
                for (let i = 0; i < 200; i++) {
                    const rx = (Math.sin(i * 61) * 0.5 + 0.5) * W;
                    const ry = (Math.cos(i * 83) * 0.5 + 0.5) * H;
                    ctx.fillRect(rx, ry, (i % 3) + 1.5, (i % 3) + 1.5);
                }

                // Beveled gold outer border
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(38, 38, W - 76, H - 76);
            }

            // 10. SYNTHWAVE RETRO
            else {
                const sg = ctx.createRadialGradient(W / 2, 280, 0, W / 2, 280, 700);
                sg.addColorStop(0, 'rgba(34, 211, 238, 0.14)');
                sg.addColorStop(1, 'transparent');
                ctx.fillStyle = sg;
                ctx.fillRect(0, 0, W, H);

                const sg2 = ctx.createRadialGradient(W - 120, H - 350, 0, W - 120, H - 350, 600);
                sg2.addColorStop(0, 'rgba(129, 140, 248, 0.14)');
                sg2.addColorStop(1, 'transparent');
                ctx.fillStyle = sg2;
                ctx.fillRect(0, 0, W, H);
            }
        }

        // Draw Standard Header
        function drawHeader(ctx, t, d, slideNum, totalSlides, W, BX, BW) {
            const curY = 95;
            ctx.fillStyle = t.accent;
            ctx.font = `bold 24px ${t.fontBody}`;
            ctx.textAlign = 'left';
            ctx.fillText("🎁 SPRINT-BOT WRAPPED", BX, curY);

            ctx.textAlign = 'right';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText(`${d.year.toUpperCase()} • ${slideNum}/${totalSlides}`, BX + BW, curY);
        }

        // Draw Standard Watermark Footer
        function drawFooter(ctx, t, W, H) {
            ctx.textAlign = 'center';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 20px ${t.fontBody}`;
            ctx.fillText("Created with Sprint-Bot • Track your writing journey", W / 2, H - 70);
        }

        // ==========================================
        // 1080x1920 CANVAS STORY RENDERER
        // ==========================================
        async function drawStoryCard(slideIdx = 0, targetCanvas = null) {
            await document.fonts.ready;
            const canvas = targetCanvas || document.getElementById('wrappedCanvas');
            const ctx = canvas.getContext('2d');
            const t = THEMES[currentThemeIndex];
            const d = WRAPPED_DATA;

            const W = 1080, H = 1920;
            canvas.width = W; canvas.height = H;
            const BX = 75, BW = W - 150;

            drawThemeTexture(ctx, t, W, H);
            drawHeader(ctx, t, d, slideIdx + 1, SLIDES.length, W, BX, BW);
            drawFooter(ctx, t, W, H);

            // Render specific slide content
            switch(slideIdx) {
                case 0: renderSlideVolume(ctx, t, d, W, H, BX, BW); break;
                case 1: renderSlideConsistency(ctx, t, d, W, H, BX, BW); break;
                case 2: renderSlideSprints(ctx, t, d, W, H, BX, BW); break;
                case 3: renderSlideSuperlatives(ctx, t, d, W, H, BX, BW); break;
                case 4: renderSlidePersona(ctx, t, d, W, H, BX, BW); break;
                case 5: renderSlideSummary(ctx, t, d, W, H, BX, BW); break;
            }
        }

        // ── SLIDE 0: THE BIG VOLUME ──────────────────────────────────────
        function renderSlideVolume(ctx, t, d, W, H, BX, BW) {
            let curY = 160;

            // Author Badge Mini-Pill
            const pillW = Math.min(BW, 460);
            rr(ctx, BX, curY, pillW, 64, 32, t.card, t.border, 1.5);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.textAlign = 'left';
            ctx.fillText(`✍️ ${d.userName} • 👑 ${d.rank}`, BX + 26, curY + 40);

            curY += 120;
            ctx.fillStyle = t.sub;
            ctx.font = `bold 26px ${t.fontBody}`;
            ctx.fillText("THIS YEAR, YOU POURED DOWN...", BX, curY);

            // Words Hero Box
            curY += 40;
            const boxH = 430;
            rr(ctx, BX, curY, BW, boxH, 36, t.card, t.border, 2);

            // Words Number (Cleanly scaled, not gigantic)
            const wordsFormatted = Number(d.totalWords || 0).toLocaleString();
            ctx.textAlign = 'center';
            ctx.fillStyle = t.text;
            let wSz = 96;
            ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            while (ctx.measureText(wordsFormatted).width > (BW - 70) && wSz > 50) {
                wSz -= 4;
                ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            }
            ctx.fillText(wordsFormatted, BX + BW / 2, curY + 185);

            ctx.fillStyle = t.accent;
            ctx.font = `800 28px ${t.fontHeading}`;
            ctx.fillText("TOTAL WORDS WRITTEN", BX + BW / 2, curY + 250);

            // Novel Equivalent Pill
            const novY = curY + 310;
            const novW = Math.min(BW - 80, 520), novH = 70;
            rr(ctx, (W - novW) / 2, novY, novW, novH, novH / 2, t.accent + '22', t.accent, 2);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 26px ${t.fontBody}`;
            ctx.fillText(`That's ${d.novelText}`, W / 2, novY + 45);

            // Breakdown Tiles
            curY += boxH + 40;
            const novellas = Math.round(d.totalWords / 20000);
            const chapters = Math.round(d.totalWords / 3000);

            const rowH = 150;
            const colW = (BW - 24) / 2;

            // Box 1: Novellas
            rr(ctx, BX, curY, colW, rowH, 26, t.card, t.border, 1.5);
            ctx.textAlign = 'left';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("📖 IN NOVELLAS", BX + 30, curY + 44);
            ctx.fillStyle = t.text;
            ctx.font = `800 46px ${t.fontHeading}`;
            ctx.fillText(`~${novellas}`, BX + 30, curY + 106);

            // Box 2: Chapters
            rr(ctx, BX + colW + 24, curY, colW, rowH, 26, t.card, t.border, 1.5);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("📑 IN CHAPTERS", BX + colW + 54, curY + 44);
            ctx.fillStyle = t.accent2;
            ctx.font = `800 46px ${t.fontHeading}`;
            ctx.fillText(`~${chapters}`, BX + colW + 54, curY + 106);

            // Narrative Quote Card
            curY += rowH + 35;
            rr(ctx, BX, curY, BW, 200, 30, t.bg, t.border, 2);
            ctx.fillStyle = t.text;
            ctx.font = `italic 26px ${t.fontHeading}`;
            ctx.textAlign = 'center';
            ctx.fillText("“You didn't just write stories this year —", W / 2, curY + 80);
            ctx.fillStyle = t.accent;
            ctx.fillText("you manufactured entire universes.”", W / 2, curY + 130);
        }

        // ── SLIDE 1: CONSISTENCY & MOMENTUM ──────────────────────────────
        function renderSlideConsistency(ctx, t, d, W, H, BX, BW) {
            let curY = 180;

            ctx.fillStyle = t.accent;
            ctx.font = `800 42px ${t.fontHeading}`;
            ctx.textAlign = 'left';
            ctx.fillText("SHOWING UP IS", BX, curY);
            ctx.fillStyle = t.text;
            ctx.fillText("HALF THE BATTLE 🔥", BX, curY + 52);

            curY += 110;
            const cBoxH = 400;
            rr(ctx, BX, curY, BW, cBoxH, 36, t.card, t.border, 2);

            ctx.fillStyle = t.sub;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText("ACTIVE WRITING DAYS", BX + 40, curY + 55);

            ctx.fillStyle = t.accent;
            ctx.font = `900 90px ${t.fontHeading}`;
            ctx.fillText(`${d.activeDays}`, BX + 40, curY + 170);

            ctx.fillStyle = t.text;
            ctx.font = `800 34px ${t.fontHeading}`;
            ctx.fillText("DAYS LOGGED", BX + 40, curY + 230);

            // Progress bar
            const pct = Math.min(100, Math.round((d.activeDays / 365) * 100));
            const pBarY = curY + 280;
            const pBarW = BW - 80;
            rr(ctx, BX + 40, pBarY, pBarW, 18, 9, 'rgba(255,255,255,0.1)', '', 0);
            rr(ctx, BX + 40, pBarY, pBarW * (pct / 100), 18, 9, t.accent, '', 0);

            ctx.fillStyle = t.sub;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText(`${pct}% of the entire year spent writing!`, BX + 40, curY + 345);

            // Best Streak Card
            curY += cBoxH + 40;
            const sBoxH = 380;
            rr(ctx, BX, curY, BW, sBoxH, 36, t.card, t.border, 2);

            ctx.fillStyle = '#f97316';
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText("🔥 LONGEST WRITING STREAK", BX + 40, curY + 55);

            ctx.fillStyle = '#f97316';
            ctx.font = `900 90px ${t.fontHeading}`;
            ctx.fillText(`${d.bestStreak}`, BX + 40, curY + 170);

            ctx.fillStyle = t.text;
            ctx.font = `800 34px ${t.fontHeading}`;
            ctx.fillText("DAYS IN A ROW", BX + 40, curY + 230);

            ctx.fillStyle = t.sub;
            ctx.font = `500 24px ${t.fontBody}`;
            ctx.fillText("Unbroken creative momentum.", BX + 40, curY + 295);
            ctx.fillText("Rain or shine — you sat down and put words on paper.", BX + 40, curY + 335);
        }

            curY += rowH + 40;

        // ── SLIDE 4: WRITER PERSONA REVEAL ───────────────────────────────
        function renderSlidePersona(ctx, t, d, W, H, BX, BW) {
            let curY = 180;

            ctx.fillStyle = t.sub;
            ctx.font = `bold 24px ${t.fontBody}`;
            ctx.textAlign = 'center';
            ctx.fillText("THE DATA HAS SPOKEN", W / 2, curY);

            ctx.fillStyle = t.text;
            ctx.font = `800 42px ${t.fontHeading}`;
            ctx.fillText("YOUR 2026 PERSONA IS...", W / 2, curY + 54);

            // Giant Hero Persona Card
            curY += 100;
            const pH = 780;
            rr(ctx, BX, curY, BW, pH, 38, t.card, t.border, 2);

            // Giant Badge Avatar
            const bSize = 190;
            const bX = (W - bSize) / 2;
            const bY = curY + 60;
            const pGrad = ctx.createLinearGradient(bX, bY, bX + bSize, bY + bSize);
            pGrad.addColorStop(0, t.accent);
            pGrad.addColorStop(1, t.accent2);
            rr(ctx, bX, bY, bSize, bSize, 40, pGrad, '', 0);

            ctx.fillStyle = '#ffffff';
            ctx.font = `95px ${t.fontHeading}`;
            ctx.textBaseline = 'middle';
            ctx.fillText(d.persona?.badge || '⚡', W / 2, bY + bSize / 2 + 5);
            ctx.textBaseline = 'alphabetic';

            // Persona Title
            ctx.fillStyle = t.text;
            const title = d.persona?.title || 'The Novel Titan ⚡';
            let tSz = 50;
            ctx.font = `900 ${tSz}px ${t.fontHeading}`;
            while (ctx.measureText(title).width > (BW - 60) && tSz > 30) {
                tSz -= 2;
                ctx.font = `900 ${tSz}px ${t.fontHeading}`;
            }
            ctx.fillText(title, W / 2, curY + 335);

            // Tagline Box
            const tagY = curY + 380;
            rr(ctx, BX + 35, tagY, BW - 70, 130, 22, t.bg, t.border, 1.5);
            ctx.fillStyle = t.sub;
            ctx.font = `italic 24px ${t.fontBody}`;
            const tagline = d.persona?.tagline || "You don't just write stories, you manufacture entire universes.";
            ctx.fillText(`“${tagline}”`, W / 2, tagY + 75);

            // Trait Badges
            curY = tagY + 170;
            const trW = (BW - 110) / 3;
            const traits = [
                { k: 'OUTPUT', v: `${(d.totalWords / 1000).toFixed(0)}K+` },
                { k: 'STREAK', v: `${d.bestStreak}d` },
                { k: 'SPEED', v: `${d.peakSprintWpm} wpm` }
            ];

            traits.forEach((tr, i) => {
                const trX = BX + 35 + i * (trW + 20);
                rr(ctx, trX, curY, trW, 105, 18, t.card, t.border, 1.5);
                ctx.fillStyle = t.sub;
                ctx.font = `bold 16px ${t.fontBody}`;
                ctx.fillText(tr.k, trX + trW / 2, curY + 38);
                ctx.fillStyle = t.accent;
                ctx.font = `800 28px ${t.fontHeading}`;
                ctx.fillText(tr.v, trX + trW / 2, curY + 80);
            });
        }

        // ── SLIDE 5: FULL MASTER SUMMARY (PROPORTIONATE & BALANCED) ────────
        function renderSlideSummary(ctx, t, d, W, H, BX, BW) {
            let curY = 145;

            // 1. Author & Persona Hero Card (Sleek 260px height)
            const heroH = 265;
            rr(ctx, BX, curY, BW, heroH, 32, t.card, t.border, 2);

            const avS = 100;
            const avX = BX + 35;
            const avY = curY + 30;
            const avGrad = ctx.createLinearGradient(avX, avY, avX + avS, avY + avS);
            avGrad.addColorStop(0, t.accent);
            avGrad.addColorStop(1, t.accent2);
            rr(ctx, avX, avY, avS, avS, 22, avGrad, '', 0);

            ctx.fillStyle = '#ffffff';
            ctx.font = `800 52px ${t.fontHeading}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const initial = (d.userName || 'W').charAt(0).toUpperCase();
            ctx.fillText(initial, avX + avS / 2, avY + avS / 2 + 3);
            ctx.textBaseline = 'alphabetic';

            // Author Name & Rank
            ctx.textAlign = 'left';
            ctx.fillStyle = t.text;
            let nSize = 42;
            ctx.font = `800 ${nSize}px ${t.fontHeading}`;
            while (ctx.measureText(d.userName).width > (BW - 190) && nSize > 26) {
                nSize -= 2;
                ctx.font = `800 ${nSize}px ${t.fontHeading}`;
            }
            ctx.fillText(d.userName, BX + 160, avY + 40);

            ctx.fillStyle = t.accent;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.fillText(`👑 ${d.rank.toUpperCase()}`, BX + 160, avY + 80);

            // Persona Banner inside Hero
            const pyY = curY + 155;
            rr(ctx, BX + 25, pyY, BW - 50, 85, 18, t.bg, t.border, 1.5);
            ctx.fillStyle = t.accent;
            ctx.font = `800 24px ${t.fontHeading}`;
            ctx.fillText(`🎭 ${d.persona?.title || 'The Passionate Storyteller ✍️'}`, BX + 45, pyY + 38);

            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            let tagline = d.persona?.tagline || "Every word written brings your story closer to life.";
            if (ctx.measureText(tagline).width > (BW - 90)) tagline = tagline.slice(0, 48) + '...';
            ctx.fillText(tagline, BX + 45, pyY + 66);

            // 2. Big Volume Card (Sleek 280px height)
            curY += heroH + 25;
            const volH = 285;
            rr(ctx, BX, curY, BW, volH, 32, t.card, t.border, 2);

            ctx.textAlign = 'center';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 20px ${t.fontBody}`;
            ctx.fillText("WORDS WRITTEN THIS YEAR", BX + BW / 2, curY + 50);

            // Large word count (scaled nicely to ~78px)
            ctx.fillStyle = t.text;
            const wordsFormatted = Number(d.totalWords || 0).toLocaleString();
            let wSz = 78;
            ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            while (ctx.measureText(wordsFormatted).width > (BW - 60) && wSz > 40) {
                wSz -= 4;
                ctx.font = `900 ${wSz}px ${t.fontHeading}`;
            }
            ctx.fillText(wordsFormatted, BX + BW / 2, curY + 145);

            // Novel Equivalent Pill
            const novY = curY + 190;
            const novW = Math.min(BW - 60, 480), novH = 62;
            rr(ctx, (W - novW) / 2, novY, novW, novH, novH / 2, t.accent + '22', t.accent, 1.8);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 23px ${t.fontBody}`;
            ctx.fillText(`That's ${d.novelText}`, W / 2, novY + 40);

            // 3. 2x2 Stat Tiles (Compact 175px height)
            curY += volH + 25;
            const tileW = (BW - 20) / 2;
            const tileH = 175;

            // Tile 1: Active Days
            rr(ctx, BX, curY, tileW, tileH, 24, t.card, t.border, 1.8);
            ctx.textAlign = 'left';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("📅 ACTIVE DAYS", BX + 26, curY + 42);
            ctx.fillStyle = t.text;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.activeDays}`, BX + 26, curY + 104);
            ctx.fillStyle = t.accent;
            ctx.font = `600 18px ${t.fontBody}`;
            const pctYear = Math.round((d.activeDays / 365) * 100);
            ctx.fillText(`${pctYear}% of the year!`, BX + 26, curY + 140);

            // Tile 2: Best Streak
            rr(ctx, BX + tileW + 20, curY, tileW, tileH, 24, t.card, t.border, 1.8);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("🔥 BEST STREAK", BX + tileW + 46, curY + 42);
            ctx.fillStyle = '#f97316';
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.bestStreak}d`, BX + tileW + 46, curY + 104);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText("Unbroken streak", BX + tileW + 46, curY + 140);

            // Row 2 of Tiles: Peak Sprint & Focus Time
            curY += tileH + 18;

            // Tile 3: Sprint Speed
            rr(ctx, BX, curY, tileW, tileH, 24, t.card, t.border, 1.8);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("⚡ PEAK SPEED", BX + 26, curY + 42);
            ctx.fillStyle = t.accent2;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.peakSprintWpm} WPM`, BX + 26, curY + 104);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText(`Top: ${d.peakSprintWords.toLocaleString()}w`, BX + 26, curY + 140);

            // Tile 4: Sprints & Hours
            rr(ctx, BX + tileW + 20, curY, tileW, tileH, 24, t.card, t.border, 1.8);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("⏱️ TIME SPRINTING", BX + tileW + 46, curY + 42);
            ctx.fillStyle = t.accent;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.sprintHours}h`, BX + tileW + 46, curY + 104);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText(`${d.totalSprints} sprints completed`, BX + tileW + 46, curY + 140);

            // 4. SUPERLATIVES (Clean Side-by-Side Cards: ZERO COLLISION)
            curY += tileH + 22;
            const supCardH = 155;

            // Box A: Peak Writing Day (Left Column)
            rr(ctx, BX, curY, tileW, supCardH, 24, t.card, t.border, 1.8);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 17px ${t.fontBody}`;
            ctx.fillText("🌟 PEAK WRITING DAY", BX + 24, curY + 38);

            ctx.fillStyle = t.text;
            ctx.font = `800 24px ${t.fontHeading}`;
            ctx.fillText(`${d.bestDay?.date || '—'}`, BX + 24, curY + 82);

            ctx.fillStyle = t.sub;
            ctx.font = `600 20px ${t.fontBody}`;
            const peakW = Number(d.bestDay?.words || 0).toLocaleString();
            ctx.fillText(`${peakW} words logged`, BX + 24, curY + 120);

            // Box B: Power Day (Right Column)
            rr(ctx, BX + tileW + 20, curY, tileW, supCardH, 24, t.card, t.border, 1.8);
            ctx.fillStyle = t.accent2;
            ctx.font = `bold 17px ${t.fontBody}`;
            ctx.fillText("🗓️ POWER DAY", BX + tileW + 44, curY + 38);

            ctx.fillStyle = t.accent2;
            ctx.font = `900 28px ${t.fontHeading}`;
            ctx.fillText(`${d.favoriteDay.toUpperCase()}`, BX + tileW + 44, curY + 84);

            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText("Most active day of week", BX + tileW + 44, curY + 120);
        }

        // Initialize Card
        updateProgressBar();
        drawStoryCard(currentSlideIndex);

        // Download Single Slide
        document.getElementById('downloadThisBtn').onclick = () => {
            const canvas = document.getElementById('wrappedCanvas');
            const link = document.createElement('a');
            const slideName = SLIDES[currentSlideIndex].id;
            link.download = `${WRAPPED_DATA.userName}-SprintBot-Wrapped-${WRAPPED_DATA.year}-${currentSlideIndex + 1}-${slideName}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        };

        // Download All Stories (ZIP Bundle)
        document.getElementById('downloadAllBtn').onclick = async () => {
            const zipText = document.getElementById('zipText');
            const zipIcon = document.getElementById('zipIcon');
            const originalText = zipText.textContent;

            zipIcon.textContent = "⏳";
            zipText.textContent = "Rendering All...";

            try {
                // Check if JSZip is loaded
                if (window.JSZip) {
                    const zip = new JSZip();
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = 1080;
                    offCanvas.height = 1920;

                    for (let i = 0; i < SLIDES.length; i++) {
                        zipText.textContent = `Card ${i + 1} of ${SLIDES.length}...`;
                        await drawStoryCard(i, offCanvas);
                        const dataUrl = offCanvas.toDataURL('image/png', 1.0);
                        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
                        const fileName = `${WRAPPED_DATA.userName}-Wrapped-${WRAPPED_DATA.year}-Card${i + 1}-${SLIDES[i].id}.png`;
                        zip.file(fileName, base64Data, { base64: true });
                    }

                    zipText.textContent = "Zipping...";
                    const content = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = `${WRAPPED_DATA.userName}-SprintBot-Wrapped-${WRAPPED_DATA.year}-CompleteStory.zip`;
                    link.href = URL.createObjectURL(content);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
                } else {
                    // Fallback if JSZip is offline: sequential individual downloads
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = 1080;
                    offCanvas.height = 1920;
                    for (let i = 0; i < SLIDES.length; i++) {
                        await drawStoryCard(i, offCanvas);
                        const link = document.createElement('a');
                        link.download = `${WRAPPED_DATA.userName}-Wrapped-${WRAPPED_DATA.year}-Card${i + 1}-${SLIDES[i].id}.png`;
                        link.href = offCanvas.toDataURL('image/png', 1.0);
                        link.click();
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            } catch (err) {
                console.error("Error creating story bundle:", err);
                alert("Could not generate zip. Downloading current card instead.");
                document.getElementById('downloadThisBtn').click();
            } finally {
                zipIcon.textContent = "📦";
                zipText.textContent = originalText;
                // Restore current slide view
                drawStoryCard(currentSlideIndex);
            }
        };

        // WhatsApp Share Action
        document.getElementById('shareBtn').onclick = async () => {
            const canvas = document.getElementById('wrappedCanvas');
            const shareText = `Check out my ${WRAPPED_DATA.year} Writing Wrapped on Sprint-Bot! 🎁\n\nTotal Words: ${WRAPPED_DATA.totalWords.toLocaleString()} (${WRAPPED_DATA.novelText})\nPersona: ${WRAPPED_DATA.persona?.title || 'Writer'}\nLongest Streak: ${WRAPPED_DATA.bestStreak} days 🔥\n\nView and download your full story here: ${window.location.href}`;
            
            if (navigator.share) {
                try {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `wrapped-${WRAPPED_DATA.year}-${SLIDES[currentSlideIndex].id}.png`, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                files: [file]
                            });
                        } else {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                url: window.location.href
                            });
                        }
                    }, 'image/png');
                } catch (e) {
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                }
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
            }
        };
    </script>
</body>
</html>
