<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{USER_NAME}}'s {{YEAR}} Sprint-Bot Wrapped</title>
    
    <!-- Meta tags for rich link previews on WhatsApp / Twitter -->
    <meta property="og:title" content="{{USER_NAME}}'s {{YEAR}} Writing Wrapped 🎁">
    <meta property="og:description" content="Total: {{TOTAL_WORDS}} words • {{NOVEL_TEXT}} • Persona: {{PERSONA_TITLE}}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#060b12">

    <!-- Fonts: Expanded with distinct AuthorRealm genre families -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700;900&family=Dancing+Script:wght@700&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Great+Vibes&family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600..900;1,600..900&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;700&family=Syncopate:wght@700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for 1-Tap All Stories Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg-color: #060b12;
            --card-bg: #0d1527;
            --accent: #22d3a0;
            --accent2: #6366f1;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 9:16 Story Frame Preview */
        .story-wrapper {
            position: relative;
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
            padding: 10px 12px 24px 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-container {
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #wrappedCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Story Progress Bars (Instagram / Spotify Style) */
        .story-progress-bar {
            display: flex;
            gap: 5px;
            width: 100%;
            padding: 4px 6px 10px 6px;
        }

        .story-progress-segment {
            height: 3.5px;
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            overflow: hidden;
            transition: background 0.25s ease;
            cursor: pointer;
        }

        .story-progress-segment.active {
            background: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        .story-progress-segment.completed {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Tap indicator overlay */
        .tap-zone-left, .tap-zone-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            z-index: 10;
        }
        .tap-zone-left { left: 0; }
        .tap-zone-right { right: 0; }

        /* Theme selector swatches */
        .theme-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .theme-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .theme-pill.active {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.18);
        }

        .theme-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Hide scrollbars */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-0 m-0">

    <!-- Top Header -->
    <header class="w-full max-w-md flex justify-between items-center px-5 pt-4 pb-2">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎁</span>
            <span class="font-extrabold text-xs tracking-wider uppercase text-slate-300" style="font-family:'Syne'">Sprint-Bot Wrapped</span>
        </div>
        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            {{YEAR}}
        </span>
    </header>

    <!-- Main Story Card Area -->
    <main class="story-wrapper">
        
        <!-- Story Progress Bars (Instagram / Spotify Style) -->
        <div id="storyProgressBar" class="story-progress-bar">
            <!-- 6 Segments injected via JS -->
        </div>

        <!-- Canvas Container with Tap Zones -->
        <div class="canvas-container relative" id="canvasFrame">
            <canvas id="wrappedCanvas" width="1080" height="1920"></canvas>
            <div class="tap-zone-left" id="tapLeft" title="Previous Story"></div>
            <div class="tap-zone-right" id="tapRight" title="Next Story"></div>
        </div>

        <!-- Story Navigation Controls -->
        <div class="w-full flex items-center justify-between mt-3 px-2">
            <button id="prevBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-bold text-slate-300 border border-white/10 active:scale-95 transition">
                <span>◀</span> Prev
            </button>
            <div class="flex flex-col items-center">
                <span id="slideIndicator" class="text-xs font-extrabold text-white tracking-wide">Story 1 of 6</span>
                <span id="slideTitle" class="text-[10px] text-slate-400 font-medium">The Big Volume</span>
            </div>
            <button id="nextBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-bold text-slate-300 border border-white/10 active:scale-95 transition">
                Next <span>▶</span>
            </button>
        </div>

        <!-- Template Selector Section -->
        <div class="w-full mt-4">
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                    <span>🎨</span> Choose Aesthetic
                </span>
                <span id="theme-counter" class="text-[11px] font-bold text-slate-500">1 of 10</span>
            </div>

            <!-- Horizontal Themes Carousel -->
            <div id="theme-carousel" class="flex gap-2 overflow-x-auto no-scrollbar py-1 px-1">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="w-full grid grid-cols-2 gap-2.5 mt-4">
            <button id="downloadThisBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-slate-900 bg-gradient-to-r from-emerald-400 to-teal-300 hover:from-emerald-300 hover:to-teal-200 active:scale-95 transition shadow-lg shadow-emerald-500/20 cursor-pointer">
                <span>📲</span> Save This Slide
            </button>
            <button id="downloadAllBtn" class="flex items-center justify-center gap-1.5 py-3 px-3 rounded-xl font-extrabold text-xs text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 active:scale-95 transition shadow-lg shadow-indigo-500/20 cursor-pointer">
                <span id="zipIcon">📦</span> <span id="zipText">Save All (ZIP)</span>
            </button>
        </div>

        <button id="shareBtn" class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl font-extrabold text-xs text-slate-200 bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 active:scale-95 transition mt-2.5 cursor-pointer">
            <span>💬</span> Share to WhatsApp Status
        </button>

        <p class="text-[11px] text-slate-500 text-center mt-3">
            Tip: Tap left or right on the card to flip through your stories. Choose any template!
        </p>
    </main>

    <!-- Data Injection -->

            {

            },
            {

                name: 'Emerald Guild',
                genre: 'Progression / Arcane Academy',
                dot: 'linear-gradient(135deg, #10b981, #d97706)',
                bg: '#02160e',

                accent: '#34d399',

                sub: '#6ee7b7',
                fontHeading: "'Cinzel', Georgia, serif",
                fontBody: "'DM Sans', sans-serif",
                style: 'alchemist'
            },
            {
                id: 'gold',
                name: 'Obsidian Royalty',
                genre: 'Imperial Court / Historical Romance',
                dot: 'linear-gradient(135deg, #eab308, #ca8a04)',
                bg: '#08080c',
                card: '#14141d',
                border: 'rgba(234, 179, 8, 0.4)',
                accent: '#fbbf24',
                accent2: '#fef08a',
                text: '#ffffff',
                sub: '#fde68a',
                fontHeading: "'Playfair Display', Georgia, serif",
                fontBody: "'Cinzel', Georgia, serif",
                style: 'gold'
            }
        ];

        // 6 Multi-Card Story Slides
        const SLIDES = [
            { id: 'volume', title: 'The Big Volume' },
            { id: 'consistency', title: 'Consistency & Momentum' },
            { id: 'sprints', title: 'Speed & Focus' },
            { id: 'superlatives', title: 'Writing Superlatives' },
            { id: 'persona', title: 'Writer Persona Reveal' },
            { id: 'summary', title: 'Full Master Summary' }
        ];

        let currentThemeIndex = 0;
        let currentSlideIndex = 0;

        // Render Story Progress Bar
        const progContainer = document.getElementById('storyProgressBar');
        SLIDES.forEach((s, idx) => {
            const seg = document.createElement('div');
            seg.className = `story-progress-segment ${idx === 0 ? 'active' : ''}`;
            seg.title = s.title;
            seg.onclick = () => goToSlide(idx);
            progContainer.appendChild(seg);
        });

        function updateProgressBar() {
            const segs = document.querySelectorAll('.story-progress-segment');
            segs.forEach((seg, idx) => {
                seg.classList.remove('active', 'completed');
                if (idx === currentSlideIndex) seg.classList.add('active');
                else if (idx < currentSlideIndex) seg.classList.add('completed');
            });
            document.getElementById('slideIndicator').textContent = `Story ${currentSlideIndex + 1} of ${SLIDES.length}`;
            document.getElementById('slideTitle').textContent = SLIDES[currentSlideIndex].title;
        }

        function goToSlide(idx) {
            currentSlideIndex = Math.max(0, Math.min(SLIDES.length - 1, idx));
            updateProgressBar();
            drawStoryCard(currentSlideIndex);
        }

        // Render Carousel Swatches
        const carousel = document.getElementById('theme-carousel');
        THEMES.forEach((t, i) => {
            const btn = document.createElement('button');
            btn.className = `theme-pill ${i === 0 ? 'active' : ''}`;
            btn.innerHTML = `<span class="theme-dot" style="background:${t.dot}"></span><span>${t.name}</span>`;
            btn.onclick = () => selectTheme(i);
            carousel.appendChild(btn);
        });

        function selectTheme(index) {
            currentThemeIndex = index;
            document.querySelectorAll('.theme-pill').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.getElementById('theme-counter').textContent = `${index + 1} of ${THEMES.length}`;
            drawStoryCard(currentSlideIndex);
        }

        // Navigation bindings
        document.getElementById('prevBtn').onclick = () => goToSlide(currentSlideIndex - 1);
        document.getElementById('nextBtn').onclick = () => goToSlide(currentSlideIndex + 1);
        document.getElementById('tapLeft').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex - 1); };
        document.getElementById('tapRight').onclick = (e) => { e.stopPropagation(); goToSlide(currentSlideIndex + 1); };

        // Touch Swipe Support
        let touchStartX = 0;
        const frame = document.getElementById('canvasFrame');
        frame.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        frame.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 45) goToSlide(currentSlideIndex + 1);
            else if (touchEndX - touchStartX > 45) goToSlide(currentSlideIndex - 1);
        }, { passive: true });

        // Safe Rounded Rectangle Helper (Clamps radius to prevent overshoot / wild lines)
        function rr(ctx, x, y, w, h, r, fill, stroke, strokeWidth) {
            r = Math.min(r, Math.floor(w / 2), Math.floor(h / 2));
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fill) { ctx.fillStyle = fill; ctx.fill(); }
            if (stroke && strokeWidth > 0) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = strokeWidth;
                ctx.stroke();
            }
        }

        // Custom Card Renderer matching each AuthorRealm Genre Aesthetic
        function drawThemeCard(ctx, t, x, y, w, h, options = {}) {
            ctx.save();
            const style = t.style || 'default';

            if (style === 'monarch') {
                // Solo Leveling Blue Holographic Window
                rr(ctx, x, y, w, h, 16, t.card, t.border, 2);
                // Corner tech notches
                ctx.strokeStyle = t.accent;
                ctx.lineWidth = 3;
                const cL = 14;
                ctx.beginPath(); ctx.moveTo(x, y + cL); ctx.lineTo(x, y); ctx.lineTo(x + cL, y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - cL, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + cL); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x, y + h - cL); ctx.lineTo(x, y + h); ctx.lineTo(x + cL, y + h); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x + w - cL, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h - cL); ctx.stroke();

                if (options.badge) {
                    ctx.fillStyle = t.accent + '22';
                    ctx.fillRect(x + 25, y - 12, 175, 24);
                    ctx.strokeStyle = t.accent;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 25, y - 12, 175, 24);
                    ctx.fillStyle = t.accent;
                    ctx.font = "bold 12px 'Share Tech Mono', monospace";
                    ctx.textAlign = 'center';
                    ctx.fillText(options.badge, x + 112, y + 4);
                }
            } else if (style === 'terminal') {
                // Retro CRT Phosphor Terminal
                ctx.fillStyle = t.card;
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = t.accent;
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
                // Corner ASCII markers
                ctx.fillStyle = t.accent;
                ctx.font = "bold 15px 'Share Tech Mono', monospace";
                ctx.textAlign = 'left';
                ctx.fillText('[+]', x + 8, y + 20);
                ctx.textAlign = 'right';
                ctx.fillText('[+]', x + w - 8, y + 20);
            } else if (style === 'scroll') {
                // Ancient Fantasy Manuscript Scroll
                rr(ctx, x, y, w, h, 16, t.card, t.border, 2.5);
                rr(ctx, x + 7, y + 7, w - 14, h - 14, 12, null, t.accent + '66', 1);
                ctx.fillStyle = t.accent;
                ctx.font = "16px 'Cinzel Decorative', serif";
                ctx.textAlign = 'center';
                ctx.fillText('✦', x + 22, y + 26);
                ctx.fillText('✦', x + w - 22, y + 26);
                ctx.fillText('✦', x + 22, y + h - 14);
                ctx.fillText('✦', x + w - 22, y + h - 14);
            } else if (style === 'gothic') {
                // Mystic Falls Dark Romance Wrought-Iron Frame
                rr(ctx, x, y, w, h, 18, t.card, '#580205', 2.5);
                rr(ctx, x + 6, y + 6, w - 12, h - 12, 14, null, t.accent + '55', 1);
                ctx.fillStyle = t.accent;
                ctx.font = "18px 'Playfair Display', serif";
                ctx.textAlign = 'center';
                ctx.fillText('❦', x + 22, y + 26);
                ctx.fillText('❦', x + w - 22, y + 26);
            } else if (style === 'celestial') {
                // 24K Gold Celestial Frame with Stars
                rr(ctx, x, y, w, h, 20, t.card, t.accent, 2);
                rr(ctx, x + 6, y + 6, w - 12, h - 12, 16, null, t.accent + '44', 1);
                ctx.fillStyle = t.accent;
                ctx.font = "15px 'Cinzel', serif";
                ctx.textAlign = 'center';
                ctx.fillText('★', x + 20, y + 25);
                ctx.fillText('★', x + w - 20, y + 25);
                ctx.fillText('★', x + 20, y + h - 13);
                ctx.fillText('★', x + w - 20, y + h - 13);
            } else if (style === 'editorial') {
                // Luxury Minimalist Hairline Frame
                ctx.fillStyle = t.card;
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = t.border;
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, w, h);
            } else if (style === 'cyber') {
                // Cyberpunk 45-degree Angled Chamfered Corners
                const cut = 22;
                ctx.beginPath();
                ctx.moveTo(x + cut, y);
                ctx.lineTo(x + w, y);
                ctx.lineTo(x + w, y + h - cut);
                ctx.lineTo(x + w - cut, y + h);
                ctx.lineTo(x, y + h);
                ctx.lineTo(x, y + cut);
                ctx.closePath();
                ctx.fillStyle = t.card;
                ctx.fill();
                ctx.strokeStyle = t.accent;
                ctx.lineWidth = 2;
                ctx.stroke();
            } else if (style === 'cozy') {
                // Cozy Romance Clean Photo Card with Washi Tape
                rr(ctx, x, y, w, h, 20, t.card, t.border, 1.5);
                const tapeW = Math.min(130, w / 3);
                ctx.fillStyle = t.accent + '44';
                ctx.fillRect(x + (w - tapeW) / 2, y - 6, tapeW, 14);
            } else {
                // Default / Imperial Royalty
                rr(ctx, x, y, w, h, 22, t.card, t.border, 2);
                if (style === 'gold') {
                    rr(ctx, x + 6, y + 6, w - 12, h - 12, 18, null, t.accent + '33', 1);
                }
            }
            ctx.restore();
        }

        // Draw Ambient Backdrop tailored to each genre
        function drawBackdrop(ctx, t, W, H) {
            ctx.fillStyle = t.bg;
            ctx.fillRect(0, 0, W, H);

            const style = t.style || 'default';

            if (style === 'terminal') {
                // Subtle CRT Scanlines
                ctx.fillStyle = 'rgba(0, 255, 65, 0.03)';
                for (let y = 0; y < H; y += 6) {
                    ctx.fillRect(0, y, W, 2);
                }
            } else if (style === 'monarch') {
                // Blueprint holographic grid
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.03)';
                ctx.lineWidth = 1;
                for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
                for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
            }

            // Atmospheric ambient radial gradient
            const g1 = ctx.createRadialGradient(W / 2, 320, 0, W / 2, 320, 720);
            g1.addColorStop(0, t.accent + '18');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, W, H);

            const g2 = ctx.createRadialGradient(W - 120, H - 380, 0, W - 120, H - 380, 650);
            g2.addColorStop(0, t.accent2 + '12');
            g2.addColorStop(1, 'transparent');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, W, H);
        }

        // Draw Standard Header
        function drawHeader(ctx, t, d, slideNum, totalSlides, W, BX, BW) {
            const curY = 95;
            ctx.fillStyle = t.accent;
            ctx.font = `bold 22px ${t.fontBody}`;
            ctx.textAlign = 'left';
            const headBrand = t.style === 'terminal' ? '> SPRINT_BOT.WRAPPED' : (t.style === 'monarch' ? '◈ SPRINT-BOT WRAPPED' : '🎁 SPRINT-BOT WRAPPED');
            ctx.fillText(headBrand, BX, curY);

            ctx.textAlign = 'right';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 20px ${t.fontBody}`;
            ctx.fillText(`${d.year.toUpperCase()} • ${slideNum}/${totalSlides}`, BX + BW, curY);
        }

        // Draw Standard Watermark Footer
        function drawFooter(ctx, t, W, H) {
            ctx.textAlign = 'center';
            ctx.fillStyle = t.sub;
            ctx.font = `500 19px ${t.fontBody}`;
            ctx.fillText("Sprint-Bot Wrapped • Track your writing journey", W / 2, H - 75);
        }

        // ==========================================
        // 1080x1920 CANVAS STORY RENDERER
        // ==========================================
        async function drawStoryCard(slideIdx = 0, targetCanvas = null) {
            await document.fonts.ready;
            const canvas = targetCanvas || document.getElementById('wrappedCanvas');
            const ctx = canvas.getContext('2d');
            const t = THEMES[currentThemeIndex];
            const d = WRAPPED_DATA;

            const W = 1080, H = 1920;
            canvas.width = W; canvas.height = H;
            const BX = 75, BW = W - 150;

            drawBackdrop(ctx, t, W, H);
            drawHeader(ctx, t, d, slideIdx + 1, SLIDES.length, W, BX, BW);
            drawFooter(ctx, t, W, H);

            // Render specific slide content
            switch(slideIdx) {
                case 0: renderSlideVolume(ctx, t, d, W, H, BX, BW); break;
                case 1: renderSlideConsistency(ctx, t, d, W, H, BX, BW); break;
                case 2: renderSlideSprints(ctx, t, d, W, H, BX, BW); break;
                case 3: renderSlideSuperlatives(ctx, t, d, W, H, BX, BW); break;
                case 4: renderSlidePersona(ctx, t, d, W, H, BX, BW); break;
                case 5: renderSlideSummary(ctx, t, d, W, H, BX, BW); break;
            }
        }

            // Novel Equivalent Pill
            const novY = curY + 205;
            const novW = Math.min(BW - 70, 480), novH = 60;
            rr(ctx, (W - novW) / 2, novY, novW, novH, novH / 2, t.accent + '22', t.accent, 2);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 24px ${t.fontBody}`;
            ctx.fillText(`That's ${d.novelText}`, W / 2, novY + 39);

            // 3. 2x2 Stat Tiles
            curY += volH + 25;
            const tileW = (BW - 20) / 2;
            const tileH = 175;

            // Tile 1: Active Days
            drawThemeCard(ctx, t, BX, curY, tileW, tileH);
            ctx.textAlign = 'left';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("📅 ACTIVE DAYS", BX + 25, curY + 40);
            ctx.fillStyle = t.text;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.activeDays}`, BX + 25, curY + 102);
            ctx.fillStyle = t.accent;
            ctx.font = `600 18px ${t.fontBody}`;
            const pctYear = Math.round((d.activeDays / 365) * 100);
            ctx.fillText(`${pctYear}% of year`, BX + 25, curY + 140);

            // Tile 2: Best Streak
            drawThemeCard(ctx, t, BX + tileW + 20, curY, tileW, tileH);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("🔥 BEST STREAK", BX + tileW + 45, curY + 40);
            ctx.fillStyle = '#f97316';
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.bestStreak}d`, BX + tileW + 45, curY + 102);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText("Unbroken flow", BX + tileW + 45, curY + 140);

            // Row 2 of Tiles: Peak Sprint & Focus Time
            curY += tileH + 18;

            // Tile 3: Sprint Speed
            drawThemeCard(ctx, t, BX, curY, tileW, tileH);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("⚡ PEAK SPEED", BX + 25, curY + 40);
            ctx.fillStyle = t.accent2;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.peakSprintWpm} WPM`, BX + 25, curY + 102);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText(`Top: ${d.peakSprintWords.toLocaleString()}w`, BX + 25, curY + 140);

            // Tile 4: Sprints & Hours
            drawThemeCard(ctx, t, BX + tileW + 20, curY, tileW, tileH);
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("⏱️ TIME SPRINTING", BX + tileW + 45, curY + 40);
            ctx.fillStyle = t.accent;
            ctx.font = `800 44px ${t.fontHeading}`;
            ctx.fillText(`${d.sprintHours}h`, BX + tileW + 45, curY + 102);
            ctx.fillStyle = t.sub;
            ctx.font = `500 18px ${t.fontBody}`;
            ctx.fillText(`${d.totalSprints} sprints`, BX + tileW + 45, curY + 140);

            // 4. Superlatives (Completely resolved layout with distinct rows)
            curY += tileH + 25;
            const supH = 190;
            drawThemeCard(ctx, t, BX, curY, BW, supH);

            ctx.textAlign = 'left';
            ctx.fillStyle = t.sub;
            ctx.font = `bold 18px ${t.fontBody}`;
            ctx.fillText("🏆 WRITING SUPERLATIVES", BX + 30, curY + 38);

            // Row 1: Peak Day
            const pDayY = curY + 88;
            ctx.fillStyle = t.text;
            ctx.font = `700 21px ${t.fontHeading}`;
            ctx.fillText("🌟 Peak Day:", BX + 30, pDayY);
            ctx.fillStyle = t.accent;
            ctx.font = `bold 21px ${t.fontBody}`;
            const peakDate = d.bestDay?.date || '—';
            const peakW = Number(d.bestDay?.words || 0).toLocaleString();
            ctx.fillText(`${peakDate}  (${peakW} words)`, BX + 165, pDayY);

            // Row 2: Power Day
            const powY = curY + 144;
            ctx.fillStyle = t.text;
            ctx.font = `700 21px ${t.fontHeading}`;
            ctx.fillText("🗓️ Power Day:", BX + 30, powY);
            ctx.fillStyle = t.accent2;
            ctx.font = `bold 21px ${t.fontBody}`;
            ctx.fillText(`${d.favoriteDay} (Most prolific)`, BX + 175, powY);
        }

        // Initialize Card
        updateProgressBar();
        drawStoryCard(currentSlideIndex);

        // Download Single Slide
        document.getElementById('downloadThisBtn').onclick = () => {
            const canvas = document.getElementById('wrappedCanvas');
            const link = document.createElement('a');
            const slideName = SLIDES[currentSlideIndex].id;
            link.download = `${WRAPPED_DATA.userName}-SprintBot-Wrapped-${WRAPPED_DATA.year}-${currentSlideIndex + 1}-${slideName}.png`;
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        };

        // Download All Stories (ZIP Bundle)
        document.getElementById('downloadAllBtn').onclick = async () => {
            const zipText = document.getElementById('zipText');
            const zipIcon = document.getElementById('zipIcon');
            const originalText = zipText.textContent;

            zipIcon.textContent = "⏳";
            zipText.textContent = "Rendering All...";

            try {
                if (window.JSZip) {
                    const zip = new JSZip();
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = 1080;
                    offCanvas.height = 1920;

                    for (let i = 0; i < SLIDES.length; i++) {
                        zipText.textContent = `Card ${i + 1} of ${SLIDES.length}...`;
                        await drawStoryCard(i, offCanvas);
                        const dataUrl = offCanvas.toDataURL('image/png', 1.0);
                        const base64Data = dataUrl.replace(/^data:image\/png;base64,/, "");
                        const fileName = `${WRAPPED_DATA.userName}-Wrapped-${WRAPPED_DATA.year}-Card${i + 1}-${SLIDES[i].id}.png`;
                        zip.file(fileName, base64Data, { base64: true });
                    }

                    zipText.textContent = "Zipping...";
                    const content = await zip.generateAsync({ type: 'blob' });
                    const link = document.createElement('a');
                    link.download = `${WRAPPED_DATA.userName}-SprintBot-Wrapped-${WRAPPED_DATA.year}-CompleteStory.zip`;
                    link.href = URL.createObjectURL(content);
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
                } else {
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = 1080;
                    offCanvas.height = 1920;
                    for (let i = 0; i < SLIDES.length; i++) {
                        await drawStoryCard(i, offCanvas);
                        const link = document.createElement('a');
                        link.download = `${WRAPPED_DATA.userName}-Wrapped-${WRAPPED_DATA.year}-Card${i + 1}-${SLIDES[i].id}.png`;
                        link.href = offCanvas.toDataURL('image/png', 1.0);
                        link.click();
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            } catch (err) {
                console.error("Error creating story bundle:", err);
                alert("Could not generate zip. Downloading current card instead.");
                document.getElementById('downloadThisBtn').click();
            } finally {
                zipIcon.textContent = "📦";
                zipText.textContent = originalText;
                drawStoryCard(currentSlideIndex);
            }
        };

        // WhatsApp Share Action
        document.getElementById('shareBtn').onclick = async () => {
            const canvas = document.getElementById('wrappedCanvas');
            const shareText = `Check out my ${WRAPPED_DATA.year} Writing Wrapped on Sprint-Bot! 🎁\n\nTotal Words: ${WRAPPED_DATA.totalWords.toLocaleString()} (${WRAPPED_DATA.novelText})\nPersona: ${WRAPPED_DATA.persona?.title || 'Writer'}\nLongest Streak: ${WRAPPED_DATA.bestStreak} days 🔥\n\nView and download your full story here: ${window.location.href}`;
            
            if (navigator.share) {
                try {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], `wrapped-${WRAPPED_DATA.year}-${SLIDES[currentSlideIndex].id}.png`, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                files: [file]
                            });
                        } else {
                            await navigator.share({
                                title: `${WRAPPED_DATA.userName}'s Writing Wrapped`,
                                text: shareText,
                                url: window.location.href
                            });
                        }
                    }, 'image/png');
                } catch (e) {
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
                }
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`, '_blank');
            }
        };
    </script>
</body>
</html>
