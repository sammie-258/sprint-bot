<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Profile — Sprint Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --accent:  #22d3a0;
            --accent2: #6366f1;
            --bg:      #060b12;
            --card-bg: rgba(255,255,255,0.04);
            --card-border: rgba(255,255,255,0.08);
            --text:    #ffffff;
            --sub:     #94a3b8;
        }
        body.light {
            --bg:      #f1f5f9;
            --card-bg: #ffffff;
            --card-border: rgba(0,0,0,0.06);
            --text:    #0f172a;
            --sub:     #64748b;
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            transition: background .3s;
            overflow-x: hidden;
        }

        /* Mesh background */
        body::before {
            content:'';
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 15% 5%,  rgba(34,211,160,.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 85%, rgba(99,102,241,.10) 0%, transparent 55%);
        }

        .dashboard-container {
            position: relative; z-index: 1;
            max-width: 480px; width: 100%;
            margin: 0 auto; padding: 30px 20px;
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .hero-stat {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            flex: 1;
        }
        body.light .hero-stat { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.04); }

        .stat-value { font-family: 'Syne', sans-serif; font-weight: 800; line-height: 1.1; }
        .stat-label { font-size: 0.6rem; font-weight: 800; letter-spacing: 0.08em; color: var(--sub); margin-top: 6px; text-transform: uppercase; }

        .progress-track { height: 10px; border-radius: 99px; background: rgba(255,255,255,0.06); overflow: hidden; position: relative; }
        body.light .progress-track { background: rgba(0,0,0,0.08); }
        .progress-fill {
            height: 100%; border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Heatmap - 3 Lines */
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 6px;
            max-width: 340px;
            margin: 0 auto;
        }
        .hcell {
            aspect-ratio: 1; border-radius: 3px;
            background: rgba(255,255,255,0.08);
            transition: transform 0.2s;
        }
        body.light .hcell { background: rgba(0,0,0,0.1); }
        .hcell.on { background: var(--accent); box-shadow: 0 0 8px rgba(34,211,160,0.3); }

        .badge-chip {
            display: inline-flex; align-items:center; gap: 8px;
            padding: 7px 14px; border-radius: 99px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.7rem; font-weight: 700;
        }
        body.light .badge-chip { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0d9488);
            color: #fff; font-weight: 700; border-radius: 14px; padding: 14px;
            width: 100%; transition: transform 0.2s;
            box-shadow: 0 8px 20px rgba(34,211,160,0.2);
        }
        .btn-secondary {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: inherit; font-weight: 700; border-radius: 14px; padding: 14px;
            width: 100%; transition: transform 0.2s;
        }

        .theme-btn {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--card-bg); border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.2s;
        }

        .fade-in { opacity: 0; transform: translateY(15px); animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="theme-btn" onclick="toggleTheme()">
    <i id="theme-icon" class="fas fa-sun" style="color:#fbbf24"></i>
</div>

<script>
const USER_DATA = {
    name:            "{{NAME}}",
    initial:         "{{INITIAL}}",
    rank:            "{{RANK}}",
    total:           "{{TOTAL}}",
    streak:          {{STREAK}},
    dailyWords:      "{{DAILY_WORDS}}",
    bestSprintWords: "{{BEST_SPRINT_WORDS}}",
    bestSprintWpm:   {{BEST_SPRINT_WPM}},
    badges:          {{BADGES_JSON}},
    activityLog:     "{{ACTIVITY_LOG}}",
    nextRankName:    "{{NEXT_RANK_NAME}}",
    nextRankPct:     parseFloat("{{NEXT_RANK_PCT}}") || 0,
    nextRankThreshold:"{{NEXT_RANK_THRESHOLD}}",
    goalActive:      "{{GOAL_DISPLAY}}" !== "hidden",
    goalCurrent:     "{{GOAL_CURRENT}}",
    goalTarget:      "{{GOAL_TARGET}}",
    goalPercent:     parseFloat("{{GOAL_PERCENT}}") || 0
};

const BADGE_DEFS = [
    {key:'first_log',     icon:'✍️',  label:'First Words'},
    {key:'streak_7',      icon:'🔥',  label:'7-Day Streak'},
    {key:'streak_30',     icon:'🌟',  label:'30-Day Streak'},
    {key:'streak_100',    icon:'💎',  label:'100-Day Streak'},
    {key:'words_10k',     icon:'📝',  label:'10K Club'},
    {key:'words_100k',    icon:'📚',  label:'100K Club'},
    {key:'words_250k',    icon:'🏗️',  label:'250K Club'},
    {key:'words_500k',    icon:'🎓',  label:'500K Club'},
    {key:'novel_god',     icon:'⚡',  label:'Novel God'},
    {key:'challenge_mvp', icon:'🏆',  label:'Challenge MVP'},
    {key:'daily_first',   icon:'🥇',  label:'Daily Champ'},
    {key:'duel_win',      icon:'⚔️',  label:'Duelist'},
    {key:'sprint_500',    icon:'💨',  label:'Speed Writer'},
];
</script>

<div class="dashboard-container">
    
    <!-- Header -->
    <div class="flex items-center gap-4 mb-6 fade-in" style="animation-delay: 0.1s">
        <div class="w-16 h-16 rounded-xl bg-gradient-to-br from-[#22d3a0] to-[#6366f1] p-0.5 shadow-lg shrink-0">
            <div class="w-full h-full rounded-xl bg-[#0d1425] flex items-center justify-center font-bold text-2xl text-[#22d3a0]" style="font-family:'Syne'">
                <span id="ui-initial"></span>
            </div>
        </div>
        <div class="flex-1 min-w-0">
            <h1 id="ui-name" class="text-xl font-extrabold leading-tight truncate" style="font-family:'Syne'"></h1>
            <div class="text-[#22d3a0] text-[10px] font-bold tracking-widest uppercase mt-0.5">
                👑 <span id="ui-rank"></span>
            </div>
        </div>
    </div>

    <!-- Hero Stats Panel -->
    <div class="flex gap-3 mb-4 fade-in" style="animation-delay: 0.2s">
        <div class="hero-stat">
            <div id="ui-total" class="stat-value text-xl"></div>
            <div class="stat-label">Total Words</div>
        </div>
        <div class="hero-stat">
            <div class="stat-value text-xl text-orange-500">
                <span id="ui-streak"></span>🔥
            </div>
            <div class="stat-label">Streak</div>
        </div>
    </div>

    <!-- Mini Stats -->
    <div class="panel grid grid-cols-2 gap-4 fade-in" style="animation-delay: 0.3s; padding: 15px;">
        <div class="text-center">
            <div id="ui-daily" class="font-bold text-lg" style="font-family:'Syne'"></div>
            <div class="stat-label !mt-1">Today</div>
        </div>
        <div class="text-center border-l border-white/5">
            <div id="ui-best" class="font-bold text-lg text-indigo-400" style="font-family:'Syne'">—</div>
            <div class="stat-label !mt-1">Best</div>
        </div>
    </div>

    <!-- Progress Panel -->
    <div class="panel fade-in" style="animation-delay: 0.4s">
        <div class="mb-4">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Rank Progress</span>
                <span id="ui-next-rank" class="text-[10px] font-bold text-[#22d3a0]"></span>
            </div>
            <div class="progress-track">
                <div id="rank-bar" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="goal-section" class="hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Daily Goal</span>
                <span id="ui-goal-count" class="text-[10px] font-bold"></span>
            </div>
            <div class="progress-track">
                <div id="goal-bar" class="progress-fill" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- Activity Panel (3 Lines) -->
    <div class="panel fade-in text-center" style="animation-delay: 0.5s">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">35-Day Activity</h3>
        <div id="heatmap" class="heatmap-grid"></div>
    </div>

    <!-- Badges Panel -->
    <div id="badge-panel" class="panel fade-in hidden" style="animation-delay: 0.6s">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Achievements</h3>
        <div id="badge-wrap" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-3 mt-4 fade-in" style="animation-delay: 0.7s">
        <button onclick="downloadImage()" class="btn-primary flex items-center justify-center gap-2">
            <i class="fas fa-download"></i> Download
        </button>
        <button onclick="shareImage()" class="btn-secondary flex items-center justify-center gap-2">
            <i class="fas fa-share-alt"></i> Share
        </button>
    </div>

    <div class="text-center mt-10 text-slate-500 text-[10px] font-bold tracking-widest flex items-center justify-center gap-2">
        <i class="fas fa-robot"></i> SPRINT BOT
    </div>

</div>

<canvas id="exportCanvas" style="display:none;"></canvas>

<script>
function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    document.getElementById('theme-icon').className = isLight ? 'fas fa-moon' : 'fas fa-sun';
    document.getElementById('theme-icon').style.color = isLight ? '#1e293b' : '#fbbf24';
    localStorage.setItem('sb-theme', isLight ? 'light' : 'dark');
}
if(localStorage.getItem('sb-theme') === 'light') toggleTheme();

function initUI() {
    document.getElementById('ui-initial').textContent = USER_DATA.initial;
    document.getElementById('ui-name').textContent    = USER_DATA.name;
    document.getElementById('ui-rank').textContent    = USER_DATA.rank;
    document.getElementById('ui-total').textContent   = USER_DATA.total;
    document.getElementById('ui-streak').textContent  = USER_DATA.streak;
    document.getElementById('ui-daily').textContent   = USER_DATA.dailyWords;

    if (USER_DATA.bestSprintWpm > 0) {
        document.getElementById('ui-best').textContent = USER_DATA.bestSprintWpm + ' WPM';
    }

    setTimeout(() => {
        document.getElementById('rank-bar').style.width = USER_DATA.nextRankPct + '%';
        document.getElementById('ui-next-rank').textContent = USER_DATA.nextRankName;
        if (USER_DATA.goalActive) {
            document.getElementById('goal-section').classList.remove('hidden');
            document.getElementById('goal-bar').style.width = USER_DATA.goalPercent + '%';
            document.getElementById('ui-goal-count').textContent = USER_DATA.goalCurrent + ' / ' + USER_DATA.goalTarget;
        }
    }, 400);

    const heatWrap = document.getElementById('heatmap');
    const bits = (USER_DATA.activityLog || '0'.repeat(35)).split('').reverse();
    bits.forEach(bit => {
        const d = document.createElement('div');
        d.className = 'hcell' + (bit === '1' ? ' on' : '');
        heatWrap.appendChild(d);
    });

    const badgeWrap = document.getElementById('badge-wrap');
    if (USER_DATA.badges?.length) {
        document.getElementById('badge-panel').classList.remove('hidden');
        USER_DATA.badges.forEach(key => {
            const def = BADGE_DEFS.find(b => b.key === key);
            if (!def) return;
            const b = document.createElement('div');
            b.className = 'badge-chip';
            b.innerHTML = `<span>${def.icon}</span><span>${def.label}</span>`;
            badgeWrap.appendChild(b);
        });
    }
}

// ════════════════════════════════════════════════
//  CANVAS EXPORT (RE-ENGINEERED v6)
// ════════════════════════════════════════════════
function rr(ctx, x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

async function drawCanvas(cb) {
    await document.fonts.ready;
    const canvas = document.getElementById('exportCanvas');
    const ctx    = canvas.getContext('2d');
    const W = 1080, H = 2600;
    canvas.width = W; canvas.height = H;

    const light = document.body.classList.contains('light');
    const p = {
        bg:      light ? '#f1f5f9' : '#060b12',
        card:    light ? '#ffffff' : '#0d1425',
        border:  light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.08)',
        text:    light ? '#0f172a' : '#ffffff',
        sub:     light ? '#64748b' : '#94a3b8',
        accent:  '#22d3a0',
        accent2: '#6366f1'
    };

    ctx.fillStyle = p.bg; ctx.fillRect(0,0,W,H);
    const gl = ctx.createRadialGradient(200,300,0,200,300,1200);
    gl.addColorStop(0, light ? 'rgba(34,211,160,0.05)' : 'rgba(34,211,160,0.08)'); gl.addColorStop(1, 'transparent');
    ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);

    let curY = 140;
    const BX = 100, BW = W - 200;

    // ── Header ──
    const AX = BX + 90, AY = curY + 90, AR = 100;
    const ag = ctx.createLinearGradient(AX-AR, AY-AR, AX+AR, AY+AR);
    ag.addColorStop(0, p.accent); ag.addColorStop(1, p.accent2);
    rr(ctx, AX-AR, AY-AR, AR*2, AR*2, 40, light ? '#ffffff' : '#0d1425', ag, 3);
    ctx.fillStyle = p.accent; ctx.font = "bold 84px 'Syne', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(USER_DATA.initial, AX, AY+6);

    ctx.textAlign = 'left'; ctx.fillStyle = p.text;
    let nameSize = 84;
    ctx.font = `800 ${nameSize}px 'Syne', sans-serif`;
    while(ctx.measureText(USER_DATA.name).width > (BW - 280) && nameSize > 40) {
        nameSize -= 2; ctx.font = `800 ${nameSize}px 'Syne', sans-serif`;
    }
    ctx.fillText(USER_DATA.name, AX + AR + 50, AY - 20);
    ctx.fillStyle = p.accent; ctx.font = "bold 32px 'DM Sans', sans-serif";
    ctx.fillText("👑 " + USER_DATA.rank.toUpperCase(), AX + AR + 50, AY + 55);
    
    curY = AY + AR + 110;

    // ── Hero Stats ──
    const PW = 420, PH = 180, PGAP = 40;
    const sX = (W - (2*PW + PGAP))/2;
    rr(ctx, sX, curY, PW, PH, 30, light ? 'rgba(0,0,0,0.01)' : 'rgba(255,255,255,0.02)', p.border, 2);
    ctx.fillStyle = p.text; 
    let totalSize = 60;
    ctx.font = `800 ${totalSize}px 'Syne', sans-serif`;
    while(ctx.measureText(USER_DATA.total).width > (PW - 40)) {
        totalSize -= 2; ctx.font = `800 ${totalSize}px 'Syne', sans-serif`;
    }
    ctx.textAlign = 'center';
    ctx.fillText(USER_DATA.total, sX + PW/2, curY + PH/2 - 15);
    ctx.fillStyle = p.sub; ctx.font = "bold 20px 'DM Sans', sans-serif";
    ctx.fillText("TOTAL WORDS", sX + PW/2, curY + PH/2 + 45);

    rr(ctx, sX + PW + PGAP, curY, PW, PH, 30, light ? 'rgba(0,0,0,0.01)' : 'rgba(255,255,255,0.02)', p.border, 2);
    ctx.fillStyle = '#f97316'; ctx.font = "800 60px 'Syne', sans-serif";
    ctx.fillText(USER_DATA.streak + '🔥', sX + PW + PGAP + PW/2, curY + PH/2 - 15);
    ctx.fillStyle = p.sub; ctx.font = "bold 20px 'DM Sans', sans-serif";
    ctx.fillText("STREAK", sX + PW + PGAP + PW/2, curY + PH/2 + 45);
    
    curY += PH + 80;

    // ── Progress ──
    rr(ctx, BX, curY, BW, 320, 40, p.card, p.border, 2);
    let py = curY + 70;
    ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 26px 'DM Sans', sans-serif";
    ctx.fillText("RANK PROGRESS", BX + 60, py);
    ctx.textAlign = 'right'; ctx.fillStyle = p.accent;
    ctx.fillText(USER_DATA.nextRankName, BX + BW - 60, py);
    py += 40;
    rr(ctx, BX + 60, py, BW - 120, 20, 10, light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)', '', 0);
    rr(ctx, BX + 60, py, (BW - 120) * (USER_DATA.nextRankPct/100), 20, 10, p.accent, '', 0);
    
    py += 80;
    ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 26px 'DM Sans', sans-serif";
    ctx.fillText("DAILY GOAL", BX + 60, py);
    ctx.textAlign = 'right'; ctx.fillStyle = p.text;
    ctx.fillText(USER_DATA.goalCurrent + ' / ' + USER_DATA.goalTarget, BX + BW - 60, py);
    py += 40;
    rr(ctx, BX + 60, py, BW - 120, 20, 10, light ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)', '', 0);
    rr(ctx, BX + 60, py, (BW - 120) * (USER_DATA.goalPercent/100), 20, 10, p.accent, '', 0);
    
    curY += 320 + 60;

    // ── Activity (3 Lines: 12 + 12 + 11) ──
    const AH = 220;
    rr(ctx, BX, curY, BW, AH, 40, p.card, p.border, 2);
    ctx.textAlign = 'center'; ctx.fillStyle = p.sub; ctx.font = "bold 26px 'DM Sans', sans-serif";
    ctx.fillText("35-DAY ACTIVITY", W/2, curY + 65);
    
    const bits = (USER_DATA.activityLog || '0'.repeat(35)).split('').reverse();
    const CS = 32, CG = 12;
    const gridW = 12 * CS + 11 * CG;
    let hx0 = (W - gridW)/2;
    let hy0 = curY + 100;
    
    bits.forEach((bit, i) => {
        const col = i % 12;
        const row = Math.floor(i / 12);
        ctx.fillStyle = bit === '1' ? p.accent : light ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.roundRect(hx0 + col*(CS+CG), hy0 + row*(CS+CG), CS, CS, 5); ctx.fill();
    });
    
    curY += AH + 60;

    // ── Badges ──
    const earned = USER_DATA.badges || [];
    if(earned.length) {
        const rowCount = Math.ceil(earned.length/3);
        const BH = 140 + (rowCount * 90);
        rr(ctx, BX, curY, BW, BH, 40, p.card, p.border, 2);
        ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 26px 'DM Sans', sans-serif";
        ctx.fillText("ACHIEVEMENTS", BX + 60, curY + 65);
        
        let bx = BX + 60;
        let by = curY + 130;
        earned.forEach((key) => {
            const def = BADGE_DEFS.find(b => b.key === key); if(!def) return;
            ctx.font = "bold 22px 'DM Sans', sans-serif";
            const chipW = ctx.measureText(def.label).width + 100;
            if(bx + chipW > BX + BW - 60) { bx = BX + 60; by += 90; }
            rr(ctx, bx, by - 45, chipW, 66, 33, light ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.04)', p.border, 1.5);
            ctx.font = '36px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText(def.icon, bx + 22, by - 12);
            ctx.fillStyle = p.text; ctx.font = "bold 22px 'DM Sans', sans-serif";
            ctx.fillText(def.label, bx + 75, by - 12);
            bx += chipW + 20;
        });
        curY += BH + 60;
    }

    // Footer
    ctx.textAlign = 'center'; ctx.fillStyle = p.sub; ctx.font = "bold 32px 'Syne', sans-serif";
    ctx.fillText("🤖 SPRINT BOT", W/2, curY + 40);

    const finalH = curY + 160;
    const tC = document.createElement('canvas'); tC.width = W; tC.height = finalH;
    tC.getContext('2d').drawImage(canvas, 0, 0);
    cb(tC);
}

function downloadImage(){ drawCanvas(c => { const a = document.createElement('a'); a.download = `sprint-bot-${USER_DATA.name}.png`; a.href = c.toDataURL('image/png'); a.click(); }); }
function shareImage(){ drawCanvas(c => { c.toBlob(async blob => { const file = new File([blob], 'profile.png', {type:'image/png'}); if(navigator.canShare && navigator.canShare({files:[file]})){ try { await navigator.share({files:[file], title:'My Profile'}); } catch(e){} } else { downloadImage(); } }); }); }

initUI();
</script>
</body>
</html>
