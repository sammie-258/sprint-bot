<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="{{NAME}} - {{RANK}}">
    <meta property="og:description" content="🔥 {{STREAK}} Day Streak | 📚 {{TOTAL}} Words Written">
    <meta property="og:image" content="https://ui-avatars.com/api/?name={{NAME}}&background=0D8ABC&color=fff&size=512">
    
    <title>{{NAME}}'s Writer Profile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glassDark: "rgba(30, 41, 59, 0.7)",
                        glassLight: "rgba(255, 255, 255, 0.6)",
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        body { font-family: 'Outfit', sans-serif; }
        
        /* Dark Mode Glass */
        .dark .glass-panel { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Light Mode Glass */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        .bg-pattern {
            background-image: url('https://images.unsplash.com/photo-1519681393798-3828fb4090bb?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gray-100 dark:bg-slate-950 text-slate-800 dark:text-white transition-colors duration-300 relative bg-pattern bg-blend-overlay dark:bg-blend-multiply">

    <div class="fixed top-4 right-4 flex gap-2 z-50">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center text-slate-600 dark:text-yellow-400 transition hover:scale-110">
            <i class="fas fa-sun dark:hidden"></i>
            <i class="fas fa-moon hidden dark:block"></i>
        </button>
    </div>

    <div id="profile-card" class="glass-panel w-full max-w-sm rounded-3xl overflow-hidden relative transform transition duration-500 hover:scale-[1.01]">
        
        <div class="h-28 bg-gradient-to-r from-emerald-500 to-blue-600 relative">
            <div class="absolute top-0 right-0 w-24 h-24 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/4 blur-xl"></div>
            <div class="absolute bottom-0 left-0 w-16 h-16 bg-black/10 rounded-full translate-y-1/3 -translate-x-1/4 blur-lg"></div>

            <div class="absolute -bottom-12 left-1/2 -translate-x-1/2">
                <div class="w-24 h-24 rounded-full bg-white dark:bg-slate-900 border-4 border-white dark:border-slate-800 flex items-center justify-center text-3xl font-bold shadow-xl text-slate-800 dark:text-white">
                    {{INITIAL}}
                </div>
            </div>
        </div>

        <div class="pt-14 pb-8 px-6 text-center">
            <h1 class="text-3xl font-extrabold mb-1 tracking-tight text-slate-800 dark:text-white">{{NAME}}</h1>
            
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/80 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-8 shadow-sm">
                <i class="fas fa-crown text-yellow-500"></i> {{RANK}}
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white/50 dark:bg-slate-800/50 p-4 rounded-2xl border border-white/50 dark:border-slate-700 shadow-sm backdrop-blur-sm">
                    <div class="text-2xl font-bold text-slate-800 dark:text-white">{{TOTAL}}</div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mt-1">Total Words</div>
                </div>
                
                <div class="bg-white/50 dark:bg-slate-800/50 p-4 rounded-2xl border border-white/50 dark:border-slate-700 shadow-sm backdrop-blur-sm relative overflow-hidden">
                    <div class="text-2xl font-bold text-orange-500 flex items-center justify-center gap-1">
                        {{STREAK}} <i class="fas fa-fire animate-pulse"></i>
                    </div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mt-1">Day Streak</div>
                </div>
            </div>

            <div id="goal-container" class="{{GOAL_DISPLAY}} mb-6">
                <div class="flex justify-between text-xs mb-2 font-bold px-1">
                    <span class="text-slate-500 dark:text-slate-400">Daily Goal</span>
                    <span class="text-slate-800 dark:text-white">{{GOAL_CURRENT}} / {{GOAL_TARGET}}</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden shadow-inner">
                    <div class="bg-gradient-to-r from-emerald-400 to-blue-500 h-full rounded-full transition-all duration-1000 relative" style="width: {{GOAL_PERCENT}}%">
                        <div class="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite]"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-100/50 dark:bg-slate-900/50 p-4 text-center border-t border-slate-200 dark:border-slate-800">
            <p class="text-xs text-slate-500 font-semibold tracking-wide">
                <i class="fas fa-robot mr-1"></i> Sprint Bot
            </p>
        </div>
    </div>

    <div class="mt-8 flex gap-4">
        <button onclick="downloadCard()" class="flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/30 transition transform hover:-translate-y-1 active:scale-95">
            <i class="fas fa-download"></i> Download
        </button>
        <button onclick="shareProfile()" class="flex items-center gap-2 px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1 active:scale-95">
            <i class="fas fa-share-alt"></i> Share
        </button>
    </div>

    <script>
        // 1. Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize Theme (Default to Dark if not set)
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }

        // 2. Download Function
        function downloadCard() {
            const card = document.getElementById('profile-card');
            
            // Temporarily disable scale transform for clean capture
            card.style.transform = 'none';
            
            html2canvas(card, {
                backgroundColor: null, // Transparent bg
                scale: 2, // Higher quality
                logging: false,
                useCORS: true // For external images
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'writer-profile.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Reset style
                card.style.transform = '';
            });
        }

        // 3. Share Function
        async function shareProfile() {
            const shareData = {
                title: 'My Writer Profile',
                text: 'Check out my writing stats on Sprint Bot! 🚀',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    // Fallback to clipboard
                    await navigator.clipboard.writeText(window.location.href);
                    alert('Link copied to clipboard!');
                }
            } catch (err) {
                console.error('Error sharing:', err);
            }
        }
    </script>
</body>
</html>
