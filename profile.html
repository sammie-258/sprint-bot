<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="{{NAME}} - {{RANK}}">
    <meta property="og:description" content="🔥 {{STREAK}} Day Streak | 📚 {{TOTAL}} Words Written">
    <meta property="og:image" content="https://ui-avatars.com/api/?name={{NAME}}&background=0D8ABC&color=fff&size=512">
    
    <title>{{NAME}}'s Writer Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white bg-[url('https://images.unsplash.com/photo-1519681393798-3828fb4090bb?q=80&w=2940&auto=format&fit=crop')] bg-cover bg-center bg-no-repeat bg-blend-multiply">

    <div class="glass-panel w-full max-w-sm rounded-3xl p-0 overflow-hidden shadow-2xl relative">
        <div class="h-24 bg-gradient-to-r from-emerald-500 to-blue-600 relative">
            <div class="absolute -bottom-10 left-1/2 -translate-x-1/2">
                <div class="w-20 h-20 rounded-full bg-slate-800 border-4 border-slate-800 flex items-center justify-center text-2xl font-bold shadow-lg text-white">
                    {{INITIAL}}
                </div>
            </div>
        </div>

        <div class="pt-12 pb-8 px-6 text-center">
            <h1 class="text-2xl font-bold mb-1">{{NAME}}</h1>
            <div class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700 text-xs font-bold text-emerald-400 uppercase tracking-wider mb-6">
                {{RANK}}
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-slate-800/50 p-3 rounded-2xl border border-slate-700">
                    <div class="text-xl font-bold text-white">{{TOTAL}}</div>
                    <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total Words</div>
                </div>
                <div class="bg-slate-800/50 p-3 rounded-2xl border border-slate-700">
                    <div class="text-xl font-bold text-orange-400">{{STREAK}} <span class="text-xs text-orange-400/70">days</span></div>
                    <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Streak</div>
                </div>
            </div>

            <div id="goal-container" class="{{GOAL_DISPLAY}}">
                <div class="flex justify-between text-xs mb-2 font-bold px-1">
                    <span class="text-slate-400">Current Goal</span>
                    <span class="text-white">{{GOAL_CURRENT}} / {{GOAL_TARGET}}</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                    <div class="bg-gradient-to-r from-emerald-400 to-blue-500 h-full rounded-full transition-all duration-1000" style="width: {{GOAL_PERCENT}}%; display: block;"></div>
                </div>
            </div>
        </div>

        <div class="bg-slate-950/50 p-3 text-center border-t border-slate-800">
            <a href="https://quillreads.com" class="text-xs text-slate-500 hover:text-emerald-400 font-medium transition">
                Sprint Bot by sam_marfe
            </a>
        </div>
    </div>

</body>
</html>
