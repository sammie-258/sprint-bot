<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writer Profile — Sprint Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --accent:  #22d3a0;
            --accent2: #6366f1;
            --bg:      #060b12;
            --card-bg: rgba(255,255,255,0.04);
            --card-border: rgba(255,255,255,0.08);
        }
        body.light {
            --bg:      #eef2f7;
            --card-bg: rgba(255,255,255,0.85);
            --card-border: rgba(0,0,0,0.08);
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: #fff;
            transition: background .3s;
            overflow-x: hidden;
        }
        body.light { color: #1e293b; }

        /* Mesh background */
        body::before {
            content:'';
            position:fixed; inset:0; z-index:0; pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 15% 5%,  rgba(34,211,160,.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 85% 85%, rgba(99,102,241,.10) 0%, transparent 55%);
        }

        .dashboard-container {
            position: relative; z-index: 1;
            max-width: 500px; width: 100%;
            margin: 0 auto; padding: 40px 20px;
        }

        /* Modular Panels */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        /* Hero Stats */
        .hero-stat {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            flex: 1;
        }
        body.light .hero-stat { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.05); }

        .stat-value { font-family: 'Syne', sans-serif; font-weight: 800; line-height: 1; }
        .stat-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; color: #94a3b8; margin-top: 8px; text-transform: uppercase; }

        /* Bars */
        .progress-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative; }
        body.light .progress-track { background: rgba(0,0,0,0.1); }
        .progress-fill {
            height: 100%; border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Heatmap */
        .hcell {
            width: 10px; height: 10px; border-radius: 2px;
            background: rgba(255,255,255,0.08);
            transition: transform 0.2s;
        }
        body.light .hcell { background: rgba(0,0,0,0.1); }
        .hcell.on { background: var(--accent); box-shadow: 0 0 8px rgba(34,211,160,0.4); }

        /* Badges */
        .badge-chip {
            display: inline-flex; align-items:center; gap: 6px;
            padding: 6px 12px; border-radius: 99px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            font-size: 0.75rem; font-weight: 600;
        }
        body.light .badge-chip { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.08); }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #0d9488);
            color: #fff; font-weight: 700; border-radius: 16px; padding: 14px;
            width: 100%; transition: transform 0.2s;
            box-shadow: 0 8px 20px rgba(34,211,160,0.3);
        }
        .btn-secondary {
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: inherit; font-weight: 700; border-radius: 16px; padding: 14px;
            width: 100%; transition: transform 0.2s;
        }
        .btn-primary:active, .btn-secondary:active { transform: scale(0.98); }

        /* Animation */
        .fade-in { opacity: 0; transform: translateY(20px); animation: fadeIn 0.6s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<script>
const USER_DATA = {
    name:            "{{NAME}}",
    initial:         "{{INITIAL}}",
    rank:            "{{RANK}}",
    total:           "{{TOTAL}}",
    streak:          {{STREAK}},
    dailyWords:      "{{DAILY_WORDS}}",
    bestSprintWords: "{{BEST_SPRINT_WORDS}}",
    bestSprintWpm:   {{BEST_SPRINT_WPM}},
    badges:          {{BADGES_JSON}},
    activityLog:     "{{ACTIVITY_LOG}}",
    nextRankName:    "{{NEXT_RANK_NAME}}",
    nextRankPct:     parseFloat("{{NEXT_RANK_PCT}}") || 0,
    nextRankThreshold:"{{NEXT_RANK_THRESHOLD}}",
    goalActive:      "{{GOAL_DISPLAY}}" !== "hidden",
    goalCurrent:     "{{GOAL_CURRENT}}",
    goalTarget:      "{{GOAL_TARGET}}",
    goalPercent:     parseFloat("{{GOAL_PERCENT}}") || 0
};

const BADGE_DEFS = [
    {key:'first_log',     icon:'✍️',  label:'First Words'},
    {key:'streak_7',      icon:'🔥',  label:'7-Day Streak'},
    {key:'streak_30',     icon:'🌟',  label:'30-Day Streak'},
    {key:'streak_100',    icon:'💎',  label:'100-Day Streak'},
    {key:'words_10k',     icon:'📝',  label:'10K Club'},
    {key:'words_100k',    icon:'📚',  label:'100K Club'},
    {key:'words_250k',    icon:'🏗️',  label:'250K Club'},
    {key:'words_500k',    icon:'🎓',  label:'500K Club'},
    {key:'novel_god',     icon:'⚡',  label:'Novel God'},
    {key:'challenge_mvp', icon:'🏆',  label:'Challenge MVP'},
    {key:'daily_first',   icon:'🥇',  label:'Daily Champ'},
    {key:'duel_win',      icon:'⚔️',  label:'Duelist'},
    {key:'sprint_500',    icon:'💨',  label:'Speed Writer'},
];
</script>

<div class="dashboard-container">
    
    <!-- Header -->
    <div class="flex flex-col items-center mb-8 fade-in" style="animation-delay: 0.1s">
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-[#22d3a0] to-[#6366f1] p-1 shadow-xl mb-4">
            <div class="w-full h-full rounded-full bg-[#0d1425] flex items-center justify-center font-bold text-4xl text-[#22d3a0]" style="font-family:'Syne'">
                <span id="ui-initial"></span>
            </div>
        </div>
        <h1 id="ui-name" class="text-3xl font-extrabold mb-2" style="font-family:'Syne'"></h1>
        <div class="px-4 py-1.5 rounded-full bg-[#22d3a01a] border border-[#22d3a04d] text-[#22d3a0] text-xs font-bold tracking-wider uppercase">
             👑 <span id="ui-rank"></span>
        </div>
    </div>

    <!-- Hero Stats Panel -->
    <div class="flex gap-4 mb-6 fade-in" style="animation-delay: 0.2s">
        <div class="hero-stat">
            <div id="ui-total" class="stat-value text-2xl"></div>
            <div class="stat-label">Total Words</div>
        </div>
        <div class="hero-stat">
            <div class="stat-value text-2xl text-orange-500">
                <span id="ui-streak"></span>🔥
            </div>
            <div class="stat-label">Day Streak</div>
        </div>
    </div>

    <!-- Mini Stats Row -->
    <div class="panel grid grid-cols-2 gap-8 fade-in" style="animation-delay: 0.3s; padding: 20px;">
        <div class="text-center">
            <div id="ui-daily" class="font-bold text-xl" style="font-family:'Syne'"></div>
            <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Today's Words</div>
        </div>
        <div class="text-center border-l border-white/5">
            <div id="ui-best" class="font-bold text-xl text-indigo-400" style="font-family:'Syne'">—</div>
            <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Best Sprint</div>
        </div>
    </div>

    <!-- Progress Panel -->
    <div class="panel fade-in" style="animation-delay: 0.4s">
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rank Progress</span>
                <span id="ui-next-rank" class="text-xs font-bold text-[#22d3a0]"></span>
            </div>
            <div class="progress-track">
                <div id="rank-bar" class="progress-fill" style="width: 0%"></div>
            </div>
            <div id="ui-words-to-go" class="text-[10px] text-slate-500 mt-2 text-right"></div>
        </div>

        <div id="goal-section" class="hidden">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Daily Goal</span>
                <span id="ui-goal-count" class="text-xs font-bold"></span>
            </div>
            <div class="progress-track">
                <div id="goal-bar" class="progress-fill" style="width: 0%"></div>
            </div>
            <div id="ui-goal-pct" class="text-[10px] text-slate-500 mt-2 text-right"></div>
        </div>
    </div>

    <!-- Activity Panel -->
    <div class="panel fade-in" style="animation-delay: 0.5s">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">35-Day Activity</h3>
        <div id="heatmap" class="flex flex-wrap gap-2 justify-center"></div>
    </div>

    <!-- Badges Panel -->
    <div id="badge-panel" class="panel fade-in hidden" style="animation-delay: 0.6s">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Achievements</h3>
        <div id="badge-wrap" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-3 mt-8 fade-in" style="animation-delay: 0.7s">
        <button onclick="downloadImage()" class="btn-primary flex items-center justify-center gap-2">
            <i class="fas fa-download"></i> Download Card
        </button>
        <button onclick="shareImage()" class="btn-secondary flex items-center justify-center gap-2">
            <i class="fas fa-share-alt"></i> Share Profile
        </button>
    </div>

    <div class="text-center mt-8 text-slate-600 text-xs font-bold tracking-widest flex items-center justify-center gap-2">
        <i class="fas fa-robot"></i> SPRINT BOT
    </div>

</div>

<canvas id="exportCanvas" style="display:none;"></canvas>

<script>
function initUI() {
    document.getElementById('ui-initial').textContent = USER_DATA.initial;
    document.getElementById('ui-name').textContent    = USER_DATA.name;
    document.getElementById('ui-rank').textContent    = USER_DATA.rank;
    document.getElementById('ui-total').textContent   = USER_DATA.total;
    document.getElementById('ui-streak').textContent  = USER_DATA.streak;
    document.getElementById('ui-daily').textContent   = USER_DATA.dailyWords;

    if (USER_DATA.bestSprintWpm > 0) {
        document.getElementById('ui-best').textContent = USER_DATA.bestSprintWpm + ' WPM';
    }

    // Bars
    setTimeout(() => {
        document.getElementById('rank-bar').style.width = USER_DATA.nextRankPct + '%';
        document.getElementById('ui-next-rank').textContent = USER_DATA.nextRankName;
        const wordsLeft = (parseInt(USER_DATA.nextRankThreshold.replace(/,/g,'')) || 0) - (parseInt(USER_DATA.total.replace(/,/g,'')) || 0);
        if (wordsLeft > 0) document.getElementById('ui-words-to-go').textContent = wordsLeft.toLocaleString() + ' words to go';
        
        if (USER_DATA.goalActive) {
            document.getElementById('goal-section').classList.remove('hidden');
            document.getElementById('goal-bar').style.width = USER_DATA.goalPercent + '%';
            document.getElementById('ui-goal-count').textContent = USER_DATA.goalCurrent + ' / ' + USER_DATA.goalTarget;
            document.getElementById('ui-goal-pct').textContent = USER_DATA.goalPercent + '%';
        }
    }, 400);

    // Heatmap
    const heatWrap = document.getElementById('heatmap');
    const bits = (USER_DATA.activityLog || '0'.repeat(35)).split('').reverse();
    bits.forEach(bit => {
        const d = document.createElement('div');
        d.className = 'hcell' + (bit === '1' ? ' on' : '');
        heatWrap.appendChild(d);
    });

    // Badges
    const badgeWrap = document.getElementById('badge-wrap');
    if (USER_DATA.badges?.length) {
        document.getElementById('badge-panel').classList.remove('hidden');
        USER_DATA.badges.forEach(key => {
            const def = BADGE_DEFS.find(b => b.key === key);
            if (!def) return;
            const b = document.createElement('div');
            b.className = 'badge-chip';
            b.innerHTML = `<span>${def.icon}</span><span>${def.label}</span>`;
            badgeWrap.appendChild(b);
        });
    }
}

// ════════════════════════════════════════════════
//  CANVAS EXPORT (RE-DESIGNED)
// ════════════════════════════════════════════════
function rr(ctx, x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

async function drawCanvas(cb) {
    // Wait for fonts to be ready
    await document.fonts.ready;
    
    const canvas = document.getElementById('exportCanvas');
    const ctx    = canvas.getContext('2d');
    const W = 1080, H = 2200; // Extra tall for spacing
    canvas.width = W; canvas.height = H;

    const p = {
        bg: '#060b12',
        card: '#0d1425',
        border: 'rgba(255,255,255,0.1)',
        text: '#ffffff',
        sub: '#94a3b8',
        accent: '#22d3a0',
        accent2: '#6366f1'
    };

    // Background
    ctx.fillStyle = p.bg; ctx.fillRect(0,0,W,H);
    const gl = ctx.createRadialGradient(200,300,0,200,300,1200);
    gl.addColorStop(0, 'rgba(34,211,160,0.1)'); gl.addColorStop(1, 'transparent');
    ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);

    // Profile Section
    let curY = 160;
    
    // Avatar
    const AX = W/2, AY = curY + 100, AR = 110;
    const ag = ctx.createLinearGradient(AX-AR, AY-AR, AX+AR, AY+AR);
    ag.addColorStop(0, p.accent); ag.addColorStop(1, p.accent2);
    ctx.beginPath(); ctx.arc(AX, AY, AR+12, 0, Math.PI*2); ctx.fillStyle = ag; ctx.fill();
    ctx.beginPath(); ctx.arc(AX, AY, AR, 0, Math.PI*2); ctx.fillStyle = '#0d1425'; ctx.fill();
    
    ctx.fillStyle = p.accent; ctx.font = "bold 96px 'Syne', sans-serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(USER_DATA.initial, AX, AY+8);
    curY = AY + AR + 100;

    // Name
    ctx.fillStyle = p.text; ctx.font = "800 90px 'Syne', sans-serif";
    ctx.fillText(USER_DATA.name, AX, curY);
    curY += 100;

    // Rank Pill
    const rt = '👑 ' + USER_DATA.rank;
    ctx.font = "bold 38px 'DM Sans', sans-serif";
    const rw = ctx.measureText(rt).width + 80;
    rr(ctx, AX-rw/2, curY-35, rw, 70, 35, 'rgba(34,211,160,0.15)', 'rgba(34,211,160,0.3)', 2);
    ctx.fillStyle = p.accent; ctx.fillText(rt, AX, curY);
    curY += 180;

    // Hero Stats (Large Panels)
    const PW = 440, PH = 220, PGAP = 40;
    const startX = (W - (2*PW + PGAP))/2;
    
    // Total Words
    rr(ctx, startX, curY, PW, PH, 30, 'rgba(255,255,255,0.03)', 'rgba(255,255,255,0.08)', 2);
    ctx.fillStyle = p.text; ctx.font = "800 64px 'Syne', sans-serif";
    ctx.fillText(USER_DATA.total, startX + PW/2, curY + PH/2 - 15);
    ctx.fillStyle = p.sub; ctx.font = "bold 24px 'DM Sans', sans-serif";
    ctx.fillText("TOTAL WORDS", startX + PW/2, curY + PH/2 + 45);

    // Streak
    rr(ctx, startX + PW + PGAP, curY, PW, PH, 30, 'rgba(255,255,255,0.03)', 'rgba(255,255,255,0.08)', 2);
    ctx.fillStyle = '#f97316'; ctx.font = "800 64px 'Syne', sans-serif";
    ctx.fillText(USER_DATA.streak + '🔥', startX + PW + PGAP + PW/2, curY + PH/2 - 15);
    ctx.fillStyle = p.sub; ctx.font = "bold 24px 'DM Sans', sans-serif";
    ctx.fillText("DAY STREAK", startX + PW + PGAP + PW/2, curY + PH/2 + 45);
    
    curY += PH + 120;

    // Content Cards Container Width
    const BX = 100, BW = W - 200;

    // Progress Section
    rr(ctx, BX, curY, BW, 380, 40, 'rgba(255,255,255,0.04)', 'rgba(255,255,255,0.08)', 2);
    let py = curY + 70;
    
    // Rank Progress
    ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 30px 'DM Sans', sans-serif";
    ctx.fillText("Rank Progress", BX + 60, py);
    ctx.textAlign = 'right'; ctx.fillStyle = p.accent;
    ctx.fillText(USER_DATA.nextRankName, BX + BW - 60, py);
    py += 40;
    rr(ctx, BX + 60, py, BW - 120, 20, 10, 'rgba(255,255,255,0.1)', '', 0);
    rr(ctx, BX + 60, py, (BW - 120) * (USER_DATA.nextRankPct/100), 20, 10, p.accent, '', 0);
    
    py += 100;
    
    // Daily Goal
    ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 30px 'DM Sans', sans-serif";
    ctx.fillText("Daily Goal", BX + 60, py);
    ctx.textAlign = 'right'; ctx.fillStyle = p.text;
    ctx.fillText(USER_DATA.goalCurrent + ' / ' + USER_DATA.goalTarget, BX + BW - 60, py);
    py += 40;
    rr(ctx, BX + 60, py, BW - 120, 20, 10, 'rgba(255,255,255,0.1)', '', 0);
    rr(ctx, BX + 60, py, (BW - 120) * (USER_DATA.goalPercent/100), 20, 10, p.accent, '', 0);
    
    curY += 380 + 60;

    // Activity
    rr(ctx, BX, curY, BW, 220, 40, 'rgba(255,255,255,0.04)', 'rgba(255,255,255,0.08)', 2);
    ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 30px 'DM Sans', sans-serif";
    ctx.fillText("35-Day Activity", BX + 60, curY + 65);
    
    const bits = (USER_DATA.activityLog || '0'.repeat(35)).split('').reverse();
    const CS = 28, CG = 8;
    let hx = BX + 60;
    let hy = curY + 110;
    bits.forEach(bit => {
        ctx.fillStyle = bit === '1' ? p.accent : 'rgba(255,255,255,0.1)';
        ctx.beginPath(); ctx.roundRect(hx, hy, CS, CS, 6); ctx.fill();
        hx += CS + CG;
    });
    
    curY += 220 + 60;

    // Badges
    const earned = USER_DATA.badges || [];
    if(earned.length) {
        const BH = Math.max(220, 100 + Math.ceil(earned.length/4)*80);
        rr(ctx, BX, curY, BW, BH, 40, 'rgba(255,255,255,0.04)', 'rgba(255,255,255,0.08)', 2);
        ctx.textAlign = 'left'; ctx.fillStyle = p.sub; ctx.font = "bold 30px 'DM Sans', sans-serif";
        ctx.fillText("Achievements", BX + 60, curY + 65);
        
        let bx = BX + 60;
        let by = curY + 120;
        earned.forEach((key, idx) => {
            const def = BADGE_DEFS.find(b => b.key === key); if(!def) return;
            ctx.font = "bold 24px 'DM Sans', sans-serif";
            const labelWidth = ctx.measureText(def.label).width;
            const chipW = labelWidth + 80;
            if(bx + chipW > BX + BW - 60) { bx = BX + 60; by += 80; }
            rr(ctx, bx, by - 40, chipW, 60, 30, 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0.1)', 1.5);
            ctx.font = '34px serif'; ctx.fillText(def.icon, bx + 18, by);
            ctx.fillStyle = p.text; ctx.font = "bold 22px 'DM Sans', sans-serif";
            ctx.fillText(def.label, bx + 65, by);
            bx += chipW + 15;
        });
        curY += BH + 60;
    }

    // Footer
    ctx.textAlign = 'center'; ctx.fillStyle = p.sub; ctx.font = "bold 36px 'Syne', sans-serif";
    ctx.fillText("🤖 SPRINT BOT", W/2, H - 120);

    if(cb) cb(canvas);
}

function downloadImage(){
    drawCanvas(c => {
        const a = document.createElement('a');
        a.download = `sprint-bot-${USER_DATA.name}.png`;
        a.href = c.toDataURL('image/png'); a.click();
    });
}
function shareImage(){
    drawCanvas(c => {
        c.toBlob(async blob => {
            const file = new File([blob], 'profile.png', {type:'image/png'});
            if(navigator.canShare && navigator.canShare({files:[file]})){
                try { await navigator.share({files:[file], title:'My Writer Profile'}); } catch(e){}
            } else { downloadImage(); }
        });
    });
}

initUI();
</script>
</body>
</html>
