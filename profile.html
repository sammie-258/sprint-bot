<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="{{NAME}} - {{RANK}}">
    <meta property="og:description" content="🔥 {{STREAK}} Day Streak | 📚 {{TOTAL}} Words Written">
    <meta property="og:image" content="https://ui-avatars.com/api/?name={{NAME}}&background=0D8ABC&color=fff&size=512">
    
    <title>{{NAME}}'s Writer Profile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glassDark: "rgba(30, 41, 59, 0.7)",
                        glassLight: "rgba(255, 255, 255, 0.6)",
                    }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; }
        
        /* Dark Mode Glass */
        .dark .glass-panel { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Light Mode Glass */
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        .bg-pattern {
            background-image: url('https://images.unsplash.com/photo-1519681393798-3828fb4090bb?q=80&w=2940&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-gray-100 dark:bg-slate-900 text-slate-800 dark:text-white transition-colors duration-300 relative bg-pattern bg-blend-overlay dark:bg-blend-multiply">

    <script>
        const USER_DATA = {
            name: "{{NAME}}",
            initial: "{{INITIAL}}",
            rank: "{{RANK}}",
            total: "{{TOTAL}}",
            streak: "{{STREAK}}",
            goalActive: "{{GOAL_DISPLAY}}" !== "hidden",
            goalCurrent: "{{GOAL_CURRENT}}",
            goalTarget: "{{GOAL_TARGET}}",
            goalPercent: parseFloat("{{GOAL_PERCENT}}") || 0
        };
    </script>

    <div class="fixed top-4 right-4 flex gap-2 z-50">
        <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center text-slate-600 dark:text-yellow-400 transition hover:scale-110">
            <i class="fas fa-sun dark:hidden"></i>
            <i class="fas fa-moon hidden dark:block"></i>
        </button>
    </div>

    <div class="glass-panel w-full max-w-sm rounded-3xl overflow-hidden relative transform transition duration-500 hover:scale-[1.01]">
        
        <div class="h-28 bg-gradient-to-r from-emerald-500 to-blue-600 relative">
            <div class="absolute -bottom-12 left-1/2 -translate-x-1/2">
                <div class="w-24 h-24 rounded-full bg-white dark:bg-slate-900 border-4 border-white dark:border-slate-800 flex items-center justify-center text-3xl font-bold shadow-xl text-slate-800 dark:text-white">
                    <span id="ui-initial"></span>
                </div>
            </div>
        </div>

        <div class="pt-14 pb-8 px-6 text-center">
            <h1 class="text-3xl font-extrabold mb-1 tracking-tight text-slate-800 dark:text-white" id="ui-name"></h1>
            
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200/80 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-8 shadow-sm">
                <span id="ui-rank"></span>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white/50 dark:bg-slate-800/50 p-4 rounded-2xl border border-white/50 dark:border-slate-700 shadow-sm backdrop-blur-sm">
                    <div class="text-2xl font-bold text-slate-800 dark:text-white" id="ui-total"></div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mt-1">Total Words</div>
                </div>
                
                <div class="bg-white/50 dark:bg-slate-800/50 p-4 rounded-2xl border border-white/50 dark:border-slate-700 shadow-sm backdrop-blur-sm relative overflow-hidden">
                    <div class="text-2xl font-bold text-orange-500 flex items-center justify-center gap-1">
                        <span id="ui-streak"></span> <i class="fas fa-fire animate-pulse"></i>
                    </div>
                    <div class="text-[10px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mt-1">Day Streak</div>
                </div>
            </div>

            <div id="ui-goal-container" class="hidden mb-6">
                <div class="flex justify-between text-xs mb-2 font-bold px-1">
                    <span class="text-slate-500 dark:text-slate-400">Daily Goal</span>
                    <span class="text-slate-800 dark:text-white" id="ui-goal-text"></span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-3 overflow-hidden shadow-inner">
                    <div id="ui-goal-bar" class="bg-gradient-to-r from-emerald-400 to-blue-500 h-full rounded-full transition-all duration-1000 relative" style="width: 0%">
                        <div class="absolute inset-0 bg-white/20 animate-[shimmer_2s_infinite]"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-slate-100/50 dark:bg-slate-900/50 p-4 text-center border-t border-slate-200 dark:border-slate-800">
            <p class="text-xs text-slate-500 font-semibold tracking-wide">
                <i class="fas fa-robot mr-1"></i> Sprint Bot by sam_marfe
            </p>
        </div>
    </div>

    <div class="mt-8 flex gap-4">
        <button onclick="downloadImage()" class="flex items-center gap-2 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-500/30 transition transform hover:-translate-y-1 active:scale-95">
            <i class="fas fa-download"></i> Download
        </button>
        <button onclick="shareImage()" class="flex items-center gap-2 px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 transition transform hover:-translate-y-1 active:scale-95">
            <i class="fas fa-share-alt"></i> Share
        </button>
    </div>

    <canvas id="exportCanvas" width="1080" height="1350" style="display:none;"></canvas>

    <script>
        // --- 1. Populate UI ---
        function initUI() {
            document.getElementById('ui-name').innerText = USER_DATA.name;
            document.getElementById('ui-initial').innerText = USER_DATA.initial;
            document.getElementById('ui-rank').innerText = "👑 " + USER_DATA.rank;
            document.getElementById('ui-total').innerText = USER_DATA.total;
            document.getElementById('ui-streak').innerText = USER_DATA.streak;

            if (USER_DATA.goalActive) {
                document.getElementById('ui-goal-container').classList.remove('hidden');
                document.getElementById('ui-goal-text').innerText = `${USER_DATA.goalCurrent} / ${USER_DATA.goalTarget}`;
                setTimeout(() => {
                    document.getElementById('ui-goal-bar').style.width = `${USER_DATA.goalPercent}%`;
                }, 100);
            }
        }

        // --- 2. Theme Logic ---
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
        
        initUI();

        // --- 3. Dynamic Canvas Generation ---
        function drawCanvas(callback) {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');
            const isDark = document.documentElement.classList.contains('dark');

            // --- Theme Color Palette ---
            const colors = isDark ? {
                bgStart: '#0f172a', bgEnd: '#1e293b',
                cardBg: 'rgba(30, 41, 59, 0.95)', cardStroke: 'rgba(255, 255, 255, 0.1)',
                text: '#ffffff', subText: '#94a3b8',
                avatarBg: '#0f172a', avatarStroke: '#1e293b',
                statBg: 'rgba(255, 255, 255, 0.05)', statStroke: 'rgba(255, 255, 255, 0.1)',
                goalBg: '#334155'
            } : {
                bgStart: '#f8fafc', bgEnd: '#e2e8f0', // Light slate
                cardBg: 'rgba(255, 255, 255, 0.95)', cardStroke: 'rgba(0, 0, 0, 0.1)',
                text: '#1e293b', subText: '#64748b',
                avatarBg: '#ffffff', avatarStroke: '#e2e8f0',
                statBg: 'rgba(0, 0, 0, 0.03)', statStroke: 'rgba(0, 0, 0, 0.05)',
                goalBg: '#cbd5e1'
            };
            
            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, 1350);
            bgGrad.addColorStop(0, colors.bgStart);
            bgGrad.addColorStop(1, colors.bgEnd);
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1350);

            // Card
            const cardX = 80, cardY = 200, cardW = 920, cardH = 950, radius = 60;
            ctx.save();
            ctx.fillStyle = colors.cardBg;
            ctx.strokeStyle = colors.cardStroke;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(cardX, cardY, cardW, cardH, radius);
            ctx.fill();
            ctx.stroke();
            ctx.clip(); 

            // Banner
            const banGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY);
            banGrad.addColorStop(0, '#10b981'); 
            banGrad.addColorStop(1, '#2563eb'); 
            ctx.fillStyle = banGrad;
            ctx.fillRect(cardX, cardY, cardW, 250);
            ctx.restore();

            // Avatar
            const avX = 540, avY = cardY + 250, avR = 100;
            ctx.beginPath();
            ctx.arc(avX, avY, avR, 0, Math.PI * 2);
            ctx.fillStyle = colors.avatarBg; 
            ctx.fill();
            ctx.lineWidth = 10;
            ctx.strokeStyle = colors.avatarStroke;
            ctx.stroke();

            // Initial
            ctx.fillStyle = isDark ? "#ffffff" : "#1e293b";
            ctx.font = "bold 80px 'Outfit', Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(USER_DATA.initial, avX, avY + 5);

            // Name
            ctx.fillStyle = colors.text;
            ctx.font = "bold 70px 'Outfit', Arial";
            ctx.fillText(USER_DATA.name, 540, 620);

            // Rank Badge
            const rankText = "👑 " + USER_DATA.rank;
            ctx.font = "bold 35px 'Outfit', Arial";
            const rankWidth = ctx.measureText(rankText).width + 60;
            ctx.fillStyle = isDark ? "rgba(51, 65, 85, 0.8)" : "rgba(203, 213, 225, 0.5)";
            ctx.beginPath();
            ctx.roundRect(540 - (rankWidth/2), 660, rankWidth, 60, 30);
            ctx.fill();
            ctx.fillStyle = isDark ? "#34d399" : "#059669";
            ctx.fillText(rankText, 540, 692);

            // Stats Boxes
            drawStatBox(ctx, 130, 780, 390, 200, USER_DATA.total, "TOTAL WORDS", colors.text, colors);
            drawStatBox(ctx, 560, 780, 390, 200, USER_DATA.streak + " 🔥", "DAY STREAK", "#f97316", colors);

            // Goal
            if (USER_DATA.goalActive) {
                const goalY = 1050;
                ctx.font = "bold 30px 'Outfit', Arial";
                ctx.fillStyle = colors.subText; 
                ctx.textAlign = "left";
                ctx.fillText("DAILY GOAL", 140, goalY);
                ctx.fillStyle = colors.text;
                ctx.textAlign = "right";
                ctx.fillText(`${USER_DATA.goalCurrent} / ${USER_DATA.goalTarget}`, 940, goalY);

                ctx.fillStyle = colors.goalBg;
                ctx.beginPath();
                ctx.roundRect(130, goalY + 20, 820, 30, 15);
                ctx.fill();

                const maxW = 820;
                const pct = Math.min(1, USER_DATA.goalPercent / 100);
                const fillW = maxW * pct;
                
                if (fillW > 0) {
                    const grad = ctx.createLinearGradient(130, 0, 950, 0);
                    grad.addColorStop(0, '#34d399');
                    grad.addColorStop(1, '#3b82f6');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.roundRect(130, goalY + 20, fillW, 30, 15);
                    ctx.fill();
                }
            }

            // Footer
            ctx.fillStyle = colors.subText;
            ctx.font = "bold 30px 'Outfit', Arial";
            ctx.textAlign = "center";
            ctx.fillText("🤖 Sprint Bot by sam_marfe", 540, 1280);

            if (callback) callback(canvas);
        }

        function drawStatBox(ctx, x, y, w, h, value, label, valueColor, colors) {
            ctx.fillStyle = colors.statBg;
            ctx.strokeStyle = colors.statStroke;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 30);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = valueColor;
            ctx.font = "bold 60px 'Outfit', Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(value, x + w/2, y + h/2 - 15);

            ctx.fillStyle = colors.subText;
            ctx.font = "bold 24px 'Outfit', Arial";
            ctx.fillText(label, x + w/2, y + h/2 + 40);
        }

        function downloadImage() {
            document.fonts.ready.then(() => {
                drawCanvas((canvas) => {
                    const link = document.createElement('a');
                    link.download = `writer-profile-${USER_DATA.name}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            });
        }

        function shareImage() {
            document.fonts.ready.then(() => {
                drawCanvas((canvas) => {
                    canvas.toBlob(async (blob) => {
                        const file = new File([blob], "profile.png", { type: "image/png" });
                        
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share({
                                    files: [file],
                                    title: 'My Writer Stats',
                                    text: `Check out my writing stats on Sprint Bot! 🚀\nRank: ${USER_DATA.rank}\nTotal: ${USER_DATA.total} words`
                                });
                            } catch (err) {
                                console.error("Share failed", err);
                            }
                        } else {
                            alert("Sharing not supported on this browser. Try downloading instead!");
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
